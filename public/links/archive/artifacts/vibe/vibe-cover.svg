<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Vibe Archive cover</title><desc id="desc">A Vibe intent specification moves through parsing, typed intermediate representation, preservation verification, proof reporting, and emission only when the gate passes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050208"/><stop offset="1" stop-color="#321040"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ff77cd"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d7bad0}.n{font-weight:900;fill:#ffe9f7}.m{font-weight:700;fill:#c8a9c0}.box{fill:#160a1d;stroke:#d052a6;stroke-width:3}.gate{fill:#193323;stroke:#8be0aa;stroke-width:4}.hold{fill:#382d18;stroke:#f2c875;stroke-width:4}.edge{fill:none;stroke:#ff77cd;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="105" class="t h" font-size="78">VIBE</text><text x="83" y="152" class="t s" font-size="24">INTENT-FIRST LANGUAGE · LOCAL-FIRST COMPILER · PRESERVATION GATE</text><g class="t" text-anchor="middle"><g transform="translate(150 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">.VIBE SPEC</text><text y="25" class="s" font-size="18">GOAL · PRESERVE</text><text y="52" class="s" font-size="18">CONSTRAINT · BRIDGE</text></g><g transform="translate(390 470)"><rect x="-100" y="-72" width="200" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">PARSE</text><text y="25" class="s" font-size="18">AST</text><text y="52" class="s" font-size="18">DIAGNOSTICS</text></g><g transform="translate(620 470)"><rect x="-100" y="-72" width="200" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">TYPED IR</text><text y="25" class="s" font-size="18">INTENT CONTRACT</text><text y="52" class="s" font-size="18">OBLIGATIONS</text></g><g transform="translate(865 470)"><rect x="-110" y="-80" width="220" height="160" rx="26" class="gate"/><text y="-24" class="n" font-size="24">VERIFY</text><text y="16" class="s" font-size="18">PRESERVATION</text><text y="45" class="s" font-size="18">CONSTRAINTS</text><text y="72" class="s" font-size="18">BRIDGE THRESHOLD</text></g><g transform="translate(1110 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">PROOF / REPORT</text><text y="25" class="s" font-size="18">HASHES · BACKEND</text><text y="52" class="s" font-size="18">OBLIGATION RESULTS</text></g><g transform="translate(1380 470)"><rect x="-125" y="-80" width="250" height="160" rx="26" class="hold"/><text y="-24" class="n" font-size="24">EMIT OR BLOCK</text><text y="16" class="s" font-size="18">PASS → TARGET</text><text y="45" class="s" font-size="18">FAIL → NO EMISSION</text><text y="72" class="s" font-size="18">REPAIR REQUIRED</text></g></g><path class="edge" d="M255 470H290"/><path class="edge" d="M490 470H520"/><path class="edge" d="M720 470H755"/><path class="edge" d="M975 470H1005"/><path class="edge" d="M1215 470H1255"/><g class="t"><text x="80" y="755" class="n" font-size="34">INTENTION IS SOURCE CODE.</text><text x="80" y="808" class="n" font-size="34">PRESERVATION IS COMPILATION TRUTH.</text><text x="80" y="870" class="s" font-size="22">Generated output is not accepted merely because it exists.</text><text x="80" y="920" class="m" font-size="18">CURRENT SCOPE: IMPLEMENTED PROTOTYPE WITH BOUNDED LANGUAGE AND DOMAIN SLICES—NOT UNIVERSAL PROGRAM VERIFICATION.</text></g></svg>