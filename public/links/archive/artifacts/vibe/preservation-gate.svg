<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Vibe preservation gate</title><desc id="desc">A proposed emission must preserve goal, constraints, authority, reversibility, evidence, and declared bridge conditions. Failure blocks output and creates a repair path.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050208"/><stop offset="1" stop-color="#281037"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d7bad0}.n{font-weight:900;fill:#ffe9f7}.m{font-weight:700;fill:#c8a9c0}.gate{fill:#160a1d;stroke:#d052a6;stroke-width:3}.core{fill:#193323;stroke:#8be0aa;stroke-width:4}.stop{fill:#391923;stroke:#ff9199;stroke-width:4}.hold{fill:#382d18;stroke:#f2c875;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">PRESERVATION GATE</text><text x="78" y="140" class="t s" font-size="23">Generation is a proposal. Verification determines whether the proposal may become an emitted artifact.</text><g transform="translate(790 460)"><circle r="260" fill="none" stroke="#ff77cd" stroke-width="5" opacity=".2"/><circle r="175" fill="none" stroke="#ba9cff" stroke-width="5" opacity=".42"/><rect x="-150" y="-96" width="300" height="192" rx="35" class="core"/><text y="-42" text-anchor="middle" class="t n" font-size="30">EMISSION GATE</text><text y="3" text-anchor="middle" class="t s" font-size="19">ALL REQUIRED OBLIGATIONS</text><text y="36" text-anchor="middle" class="t s" font-size="19">PASS CONFIGURED THRESHOLD</text><text y="72" text-anchor="middle" class="t s" font-size="19">OR OUTPUT IS BLOCKED</text></g><g class="t" text-anchor="middle"><g transform="translate(790 180)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">GOAL PRESERVED</text></g><g transform="translate(1110 265)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">CONSTRAINTS</text></g><g transform="translate(1235 505)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">AUTHORITY</text></g><g transform="translate(1090 735)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">REVERSIBILITY</text></g><g transform="translate(490 735)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">EVIDENCE</text></g><g transform="translate(345 505)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">SIDE EFFECTS</text></g><g transform="translate(470 265)"><rect x="-125" y="-43" width="250" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">BRIDGE CONDITIONS</text></g></g><g transform="translate(1425 700)"><rect x="-125" y="-75" width="250" height="150" rx="25" class="stop"/><text y="-24" text-anchor="middle" class="t n" font-size="24">BLOCK + REPAIR</text><text y="17" text-anchor="middle" class="t s" font-size="17">NO TARGET EMITTED</text><text y="47" text-anchor="middle" class="t s" font-size="17">PROOF REPORT RETAINED</text></g><text x="80" y="840" class="t m" font-size="18">SAFE PATCHING REMAINS NARROW, OPTIONAL, PREVIEW-FIRST, AND HUMAN-REVIEWED BEFORE ANY APPLY OPERATION.</text></svg>