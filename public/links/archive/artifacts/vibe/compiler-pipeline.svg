<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Vibe compiler pipeline</title><desc id="desc">A local Vibe source is parsed and lowered to typed IR, produces verification obligations, evaluates preservation and bridge conditions, writes proof metadata, then emits only if the configured gate passes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050208"/><stop offset="1" stop-color="#281037"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ff77cd"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d7bad0}.n{font-weight:900;fill:#ffe9f7}.m{font-weight:700;fill:#c8a9c0}.box{fill:#160a1d;stroke:#d052a6;stroke-width:3}.good{fill:#193323;stroke:#8be0aa;stroke-width:4}.stop{fill:#391923;stroke:#ff9199;stroke-width:4}.edge{fill:none;stroke:#ff77cd;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">VIBE COMPILER PIPELINE</text><text x="78" y="140" class="t s" font-size="23">Deterministic-by-default, local-first, proof-producing, and emission-gated.</text><g class="t" text-anchor="middle"><g transform="translate(170 350)"><rect x="-115" y="-70" width="230" height="140" rx="24" class="box"/><text y="-18" class="n" font-size="25">SOURCE</text><text y="20" class="s" font-size="18">GOAL · INPUTS</text><text y="48" class="s" font-size="18">PRESERVE · CONSTRAINT</text></g><g transform="translate(470 350)"><rect x="-115" y="-70" width="230" height="140" rx="24" class="box"/><text y="-18" class="n" font-size="25">AST → TYPED IR</text><text y="20" class="s" font-size="18">TYPES · DOMAIN</text><text y="48" class="s" font-size="18">INTENT STRUCTURE</text></g><g transform="translate(790 350)"><rect x="-135" y="-84" width="270" height="168" rx="26" class="box"/><text y="-38" class="n" font-size="25">OBLIGATIONS</text><text y="2" class="s" font-size="18">PRESERVATION · SAFETY</text><text y="32" class="s" font-size="18">CONSTRAINT · BRIDGE</text><text y="62" class="s" font-size="18">DOMAIN METADATA</text></g><g transform="translate(1110 350)"><rect x="-135" y="-84" width="270" height="168" rx="26" class="good"/><text y="-38" class="n" font-size="25">VERIFY + REPORT</text><text y="2" class="s" font-size="18">BACKEND RESULTS</text><text y="32" class="s" font-size="18">HASHES · SUMMARIES</text><text y="62" class="s" font-size="18">BRIDGE OUTCOME</text></g></g><path class="edge" d="M285 350H355"/><path class="edge" d="M585 350H655"/><path class="edge" d="M925 350H975"/><g class="t" text-anchor="middle"><g transform="translate(1420 245)"><rect x="-115" y="-60" width="230" height="120" rx="22" class="good"/><text y="-9" class="n" font-size="24">PASS</text><text y="29" class="s" font-size="18">EMIT TARGET</text></g><g transform="translate(1420 455)"><rect x="-115" y="-60" width="230" height="120" rx="22" class="stop"/><text y="-9" class="n" font-size="24">FAIL</text><text y="29" class="s" font-size="18">BLOCK EMISSION</text></g></g><path class="edge" d="M1245 315L1305 265"/><path class="edge" d="M1245 385L1305 435"/><g class="t"><text x="90" y="660" class="n" font-size="27">PROOF IN CURRENT VIBE MEANS MACHINE-CHECKABLE VERIFIER METADATA.</text><text x="90" y="710" class="s" font-size="21">It includes hashes, backend metadata, obligation outcomes, summaries, and evidence surfaces produced by the implemented pipeline.</text><text x="90" y="785" class="n" font-size="26">IT DOES NOT MEAN COMPLETE THEOREM PROVING OR FULL FORMAL VERIFICATION OF ARBITRARY PROGRAM SEMANTICS.</text><text x="90" y="840" class="m" font-size="18">LOCAL SNAPSHOTS AND REGISTRY OPERATIONS PRESERVE HONEST INPUT PROVENANCE; EXTERNAL OBLIGATIONS ARE CONTROLLED AND NOT REMOTELY AUTO-DISCOVERED.</text></g></svg>