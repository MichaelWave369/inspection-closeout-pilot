<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Coherence Bridge mandate renewal map</title><desc id="d">A human mandate moves through consent, observation, protected dissent, drift review, pause or renewal, repair, and receipt before continued operation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08050b"/><stop offset="1" stop-color="#201426"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7de1db"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff4fb}.s{font-weight:600;fill:#cfb8c8}.n{font-weight:900;fill:#ffe7f6}.box{fill:#17101c;stroke:#ea9bcb;stroke-width:3}.hot{fill:#14302f;stroke:#7de1db;stroke-width:4}.e{stroke:#7de1db;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="60">MANDATE RENEWAL / PAUSE / REPAIR</text><text x="82" y="140" class="t s" font-size="23">Continued operation is earned through renewed human authority—not assumed from prior engagement.</text><g class="t" text-anchor="middle"><g transform="translate(150 430)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="hot"/><text y="-8" class="n" font-size="23">HUMAN</text><text y="26" class="s" font-size="17">MANDATE</text></g><g transform="translate(390 430)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="box"/><text y="-8" class="n" font-size="23">CONSENT</text><text y="26" class="s" font-size="17">CURRENT?</text></g><g transform="translate(630 430)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="box"/><text y="-8" class="n" font-size="23">DISSENT</text><text y="26" class="s" font-size="17">VISIBLE?</text></g><g transform="translate(870 430)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="box"/><text y="-8" class="n" font-size="23">DRIFT</text><text y="26" class="s" font-size="17">REVIEW</text></g><g transform="translate(1110 330)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="hot"/><text y="-8" class="n" font-size="23">RENEW</text><text y="26" class="s" font-size="17">BOUNDED MANDATE</text></g><g transform="translate(1110 550)"><rect x="-105" y="-60" width="210" height="120" rx="22" class="hot"/><text y="-8" class="n" font-size="23">PAUSE</text><text y="26" class="s" font-size="17">RESTORE HUMAN CONTROL</text></g><g transform="translate(1370 430)"><rect x="-115" y="-75" width="230" height="150" rx="22" class="box"/><text y="-24" class="n" font-size="23">REPAIR +</text><text y="10" class="n" font-size="23">RECEIPT</text><text y="48" class="s" font-size="16">WHY CONTINUE OR STOP</text></g></g><g class="e"><line x1="255" y1="430" x2="275" y2="430"/><line x1="495" y1="430" x2="515" y2="430"/><line x1="735" y1="430" x2="755" y2="430"/><path d="M975 410L1000 355"/><path d="M975 450L1000 525"/><path d="M1215 330L1260 395"/><path d="M1215 550L1260 465"/></g><text x="800" y="750" text-anchor="middle" class="t n" font-size="24">STALE CONSENT, SUPPRESSED DISSENT, OR DEPENDENCY SIGNALS SHOULD MAKE PAUSE EASIER—NOT HARDER.</text><text x="800" y="805" text-anchor="middle" class="t s" font-size="18">A RECEIPT RECORDS THE DECISION. IT DOES NOT MAKE THE DECISION ETHICAL BY ITSELF.</text></svg>