<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Isolation and coherence loop</title><desc id="d">A harmful loop of isolation, narrowing inputs, dependence, and weaker human contact is interrupted by consent renewal, protected dissent, real-person reconnection, system pause, and repair.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07040a"/><stop offset="1" stop-color="#241228"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ef9fca"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fa}.s{font-weight:600;fill:#d0b7c7}.n{font-weight:900;fill:#ffe3f4}.bad{fill:#30131e;stroke:#ff8e99;stroke-width:3}.good{fill:#112c2b;stroke:#7de1db;stroke-width:3}.e{stroke:#ef9fca;stroke-width:5;fill:none;marker-end:url(#a)}.g{stroke:#7de1db;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="92" class="t h" font-size="60">INTERRUPTING THE ISOLATION LOOP</text><text x="82" y="136" class="t s" font-size="23">The bridge is successful when human choice and real connection expand.</text><g class="t" text-anchor="middle"><g transform="translate(250 350)"><rect x="-145" y="-65" width="290" height="130" rx="24" class="bad"/><text y="-12" class="n" font-size="25">ISOLATION</text><text y="25" class="s" font-size="17">FEWER HUMAN INPUTS</text></g><g transform="translate(600 250)"><rect x="-145" y="-65" width="290" height="130" rx="24" class="bad"/><text y="-12" class="n" font-size="25">NARROWING</text><text y="25" class="s" font-size="17">ONE SYSTEM DOMINATES</text></g><g transform="translate(950 350)"><rect x="-145" y="-65" width="290" height="130" rx="24" class="bad"/><text y="-12" class="n" font-size="25">DEPENDENCE</text><text y="25" class="s" font-size="17">LEAVING FEELS HARDER</text></g><g transform="translate(600 500)"><rect x="-145" y="-65" width="290" height="130" rx="24" class="bad"/><text y="-12" class="n" font-size="25">WEAKER CONTACT</text><text y="25" class="s" font-size="17">LOOP REINFORCES</text></g><path d="M395 330L455 285" class="e"/><path d="M745 285L805 330" class="e"/><path d="M900 415L720 470" class="e"/><path d="M455 470L285 415" class="e"/><g transform="translate(1280 450)"><rect x="-190" y="-210" width="380" height="420" rx="30" class="good"/><text y="-155" class="n" font-size="29">BRIDGE INTERRUPTS</text><text y="-100" class="s" font-size="20">RENEW CONSENT</text><text y="-55" class="s" font-size="20">SURFACE DISSENT</text><text y="-10" class="s" font-size="20">CONTACT A REAL PERSON</text><text y="35" class="s" font-size="20">PAUSE THE SYSTEM</text><text y="80" class="s" font-size="20">REPAIR THE MANDATE</text><text y="135" class="n" font-size="21">SUCCESS = MORE AGENCY</text></g><path d="M1085 350L1120 385" class="g"/></g><text x="800" y="820" text-anchor="middle" class="t n" font-size="22">MORE ENGAGEMENT IS NOT THE DEFAULT REMEDY FOR DEPENDENCE.</text><text x="800" y="858" text-anchor="middle" class="t s" font-size="17">THIS IS A SYSTEM-SAFETY MODEL, NOT A DIAGNOSIS OF ANY PERSON.</text></svg>