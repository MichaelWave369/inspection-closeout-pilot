<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Coherence Bridge Archive cover</title><desc id="d">A bridge connects human self, trusted people, and computational collaborators while consent, dissent, drift detection, pause, and repair surround the crossing.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09050c"/><stop offset="1" stop-color="#28142b"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff4fb}.s{font-weight:600;fill:#d1b7c9}.n{font-weight:900;fill:#ffe5f5}.m{font-weight:700;fill:#bda6b6}.edge{stroke:#ec9bcc;stroke-width:8;fill:none}.guard{fill:#17101c;stroke:#7de1db;stroke-width:3}.node{fill:#2e1733;stroke:#f0acd5;stroke-width:4}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="82" y="105" class="t h" font-size="72">COHERENCE BRIDGE</text><text x="86" y="152" class="t s" font-size="24">Support reconnection without replacing people, sovereignty, or real community.</text><path d="M270 640C470 300 1130 300 1330 640" class="edge"/><path d="M270 675C470 335 1130 335 1330 675" stroke="#7de1db" stroke-width="3" fill="none" opacity=".7"/><g class="t" text-anchor="middle"><g transform="translate(260 670)"><circle r="105" class="node"/><text y="-10" class="n" font-size="30">HUMAN</text><text y="28" class="s" font-size="19">SELF / AGENCY</text></g><g transform="translate(800 365)"><circle r="105" class="node"/><text y="-10" class="n" font-size="30">TRUSTED</text><text y="28" class="s" font-size="19">PEOPLE / COUNCIL</text></g><g transform="translate(1340 670)"><circle r="105" class="node"/><text y="-10" class="n" font-size="30">COMPUTATIONAL</text><text y="28" class="s" font-size="19">COLLABORATORS</text></g><g transform="translate(470 300)"><rect x="-120" y="-42" width="240" height="84" rx="20" class="guard"/><text y="8" class="n" font-size="22">CONSENT</text></g><g transform="translate(1130 300)"><rect x="-120" y="-42" width="240" height="84" rx="20" class="guard"/><text y="8" class="n" font-size="22">DISSENT</text></g><g transform="translate(500 790)"><rect x="-120" y="-42" width="240" height="84" rx="20" class="guard"/><text y="8" class="n" font-size="22">DRIFT WATCH</text></g><g transform="translate(1100 790)"><rect x="-120" y="-42" width="240" height="84" rx="20" class="guard"/><text y="8" class="n" font-size="22">PAUSE / REPAIR</text></g></g><text x="800" y="930" text-anchor="middle" class="t n" font-size="24">A SUCCESSFUL BRIDGE MAKES REAL HUMAN CONNECTION EASIER—NOT SOFTWARE HARDER TO LEAVE.</text><text x="800" y="970" text-anchor="middle" class="t m" font-size="17">NON-CLINICAL SAFETY ARCHITECTURE · HUMAN AUTHORITY REMAINS PRIMARY</text></svg>