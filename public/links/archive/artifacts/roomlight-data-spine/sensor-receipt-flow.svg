<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RoomLight sensor-to-receipt flow</title><desc id="desc">A sensor observation becomes a local packet, is checked for calibration and freshness, passes through a safety envelope and human review, and only then may become a field receipt.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02070b"/><stop offset="1" stop-color="#102934"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6ed6e7"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f0fcff}.s{font-weight:600;fill:#abc8cf}.n{font-weight:900;fill:#e2faff}.m{font-weight:700;fill:#94b3bc}.box{fill:#081720;stroke:#4caabd;stroke-width:3}.warn{fill:#2c2410;stroke:#efc878;stroke-width:3}.edge{stroke:#6ed6e7;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="82" y="95" class="t h" font-size="62">SENSOR → PACKET → RECEIPT</text><text x="84" y="140" class="t s" font-size="23">Every step preserves uncertainty, source identity, and the difference between a reading and a verified claim.</text><g class="t" text-anchor="middle"><g transform="translate(150 410)"><rect x="-110" y="-80" width="220" height="160" rx="25" class="box"/><text y="-20" class="n" font-size="24">OBSERVATION</text><text y="22" class="s" font-size="17">VALUE · UNIT</text><text y="52" class="s" font-size="17">SENSOR ID</text></g><g transform="translate(430 410)"><rect x="-110" y="-80" width="220" height="160" rx="25" class="box"/><text y="-20" class="n" font-size="24">LOCAL PACKET</text><text y="22" class="s" font-size="17">TIME · SOURCE</text><text y="52" class="s" font-size="17">RAW + DERIVED</text></g><g transform="translate(710 410)"><rect x="-120" y="-95" width="240" height="190" rx="25" class="warn"/><text y="-42" class="n" font-size="24">QUALITY GATE</text><text y="0" class="s" font-size="17">CALIBRATION AGE</text><text y="30" class="s" font-size="17">FRESHNESS</text><text y="60" class="s" font-size="17">DISAGREEMENT</text></g><g transform="translate(1000 410)"><rect x="-120" y="-95" width="240" height="190" rx="25" class="box"/><text y="-42" class="n" font-size="24">SAFETY ENVELOPE</text><text y="0" class="s" font-size="17">OBSERVE</text><text y="30" class="s" font-size="17">QUARANTINE</text><text y="60" class="s" font-size="17">NO AUTO-CONTROL</text></g><g transform="translate(1280 410)"><rect x="-110" y="-80" width="220" height="160" rx="25" class="box"/><text y="-20" class="n" font-size="24">HUMAN REVIEW</text><text y="22" class="s" font-size="17">ACCEPT · REJECT</text><text y="52" class="s" font-size="17">RECALIBRATE</text></g><g transform="translate(1500 410)"><circle r="75" class="box"/><text y="-8" class="n" font-size="23">FIELD</text><text y="24" class="n" font-size="23">RECEIPT</text></g></g><g class="edge"><line x1="260" y1="410" x2="310" y2="410"/><line x1="540" y1="410" x2="580" y2="410"/><line x1="830" y1="410" x2="870" y2="410"/><line x1="1120" y1="410" x2="1160" y2="410"/><line x1="1390" y1="410" x2="1415" y2="410"/></g><g class="t"><rect x="180" y="650" width="1240" height="120" rx="28" fill="#07131a" stroke="#3f8290"/><text x="800" y="700" text-anchor="middle" class="n" font-size="25">REQUIRED CONTEXT: LOCATION SCOPE · METHOD · CALIBRATION · UNCERTAINTY · AUTHORITY · HUMAN DECISION</text><text x="800" y="740" text-anchor="middle" class="m" font-size="18">A COMPLETE PACKET CAN STILL CONTAIN A BAD SENSOR READING. STRUCTURE DOES NOT CREATE TRUTH.</text></g></svg>