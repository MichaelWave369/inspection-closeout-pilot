<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RoomLight safety envelope map</title><desc id="desc">The RoomLight safety envelope separates observation, advisory interpretation, human approval, and prohibited autonomous control, with quarantine and manual override paths.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02080b"/><stop offset="1" stop-color="#0f2932"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f0fcff}.s{font-weight:600;fill:#abc8cf}.n{font-weight:900;fill:#e4fbff}.m{font-weight:700;fill:#91b2ba}.ok{fill:#0d2e24;stroke:#78d8a2;stroke-width:4}.watch{fill:#2d260f;stroke:#efc878;stroke-width:4}.stop{fill:#38151b;stroke:#ff9099;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="62">ROOMLIGHT SAFETY ENVELOPE</text><text x="82" y="140" class="t s" font-size="23">Observation, interpretation, authority, and control must remain visibly separate.</text><g class="t" text-anchor="middle"><g transform="translate(300 390)"><rect x="-190" y="-130" width="380" height="260" rx="34" class="ok"/><text y="-58" class="n" font-size="30">ALLOWED</text><text y="-8" class="s" font-size="21">READ LOCAL SENSORS</text><text y="30" class="s" font-size="21">RECORD CALIBRATION</text><text y="68" class="s" font-size="21">CREATE OBSERVATION PACKET</text><text y="106" class="s" font-size="21">SHOW UNCERTAINTY</text></g><g transform="translate(800 390)"><rect x="-190" y="-130" width="380" height="260" rx="34" class="watch"/><text y="-58" class="n" font-size="30">HUMAN REVIEW</text><text y="-8" class="s" font-size="21">ACCEPT OR QUARANTINE</text><text y="30" class="s" font-size="21">REQUEST RECALIBRATION</text><text y="68" class="s" font-size="21">AUTHORIZE BOUNDED ACTION</text><text y="106" class="s" font-size="21">MANUAL OVERRIDE</text></g><g transform="translate(1300 390)"><rect x="-190" y="-130" width="380" height="260" rx="34" class="stop"/><text y="-58" class="n" font-size="30">PROHIBITED</text><text y="-8" class="s" font-size="21">CLAIM CERTIFIED SAFETY</text><text y="30" class="s" font-size="21">MEDICAL OR HAZARD DIAGNOSIS</text><text y="68" class="s" font-size="21">HIDDEN MONITORING</text><text y="106" class="s" font-size="21">UNAUTHORIZED HAZARDOUS CONTROL</text></g></g><g class="t"><rect x="205" y="680" width="1190" height="105" rx="26" fill="#07151b" stroke="#4ba9ba"/><text x="800" y="724" text-anchor="middle" class="n" font-size="25">STALE, MISSING, DISAGREEING, OR OUT-OF-RANGE DATA MUST BE QUARANTINED—NOT SMOOTHED INTO CONFIDENCE.</text><text x="800" y="760" text-anchor="middle" class="m" font-size="17">AN ALERT IS A REQUEST FOR REVIEW. IT IS NOT A DIAGNOSIS, CERTIFICATION, OR AUTOMATIC COMMAND.</text></g></svg>