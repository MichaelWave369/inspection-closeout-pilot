<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">RoomLight Data Spine Archive cover</title><desc id="desc">A local room sensor node sends calibrated observations into a safety envelope, human review, and evidence receipt without directly controlling hazardous equipment.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02080c"/><stop offset="1" stop-color="#0d2a34"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#67d6e8"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effcff}.s{font-weight:600;fill:#a9c9d0}.n{font-weight:900;fill:#e4fbff}.m{font-weight:700;fill:#94b6bf}.box{fill:#071720;stroke:#4aa9ba;stroke-width:3}.hot{fill:#10323e;stroke:#7fe2ef;stroke-width:5}.edge{stroke:#67d6e8;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="82" y="105" class="t h" font-size="72">ROOMLIGHT DATA SPINE</text><text x="86" y="152" class="t s" font-size="24">Local sensing, visible calibration, human review, and receipts before control.</text><g class="t" text-anchor="middle"><g transform="translate(210 500)"><rect x="-135" y="-110" width="270" height="220" rx="32" class="hot"/><text y="-40" class="n" font-size="28">ROOM NODE</text><text y="5" class="s" font-size="19">TEMPERATURE</text><text y="38" class="s" font-size="19">HUMIDITY</text><text y="71" class="s" font-size="19">LIGHT · AIR · STATUS</text></g><g transform="translate(550 500)"><rect x="-135" y="-110" width="270" height="220" rx="32" class="box"/><text y="-35" class="n" font-size="27">CALIBRATION</text><text y="8" class="s" font-size="18">AGE · RANGE</text><text y="41" class="s" font-size="18">DISAGREEMENT</text><text y="74" class="s" font-size="18">PACKET FRESHNESS</text></g><g transform="translate(890 500)"><rect x="-145" y="-120" width="290" height="240" rx="32" class="box"/><text y="-48" class="n" font-size="27">SAFETY ENVELOPE</text><text y="-3" class="s" font-size="18">OBSERVE ONLY</text><text y="30" class="s" font-size="18">QUARANTINE UNCERTAINTY</text><text y="63" class="s" font-size="18">MANUAL OVERRIDE</text><text y="96" class="s" font-size="18">NO HAZARDOUS CONTROL</text></g><g transform="translate(1220 500)"><rect x="-135" y="-110" width="270" height="220" rx="32" class="hot"/><text y="-36" class="n" font-size="27">HUMAN REVIEW</text><text y="9" class="s" font-size="18">ACCEPT · REJECT</text><text y="42" class="s" font-size="18">RECALIBRATE</text><text y="75" class="s" font-size="18">RECEIPT</text></g><g transform="translate(1450 500)"><circle r="84" class="box"/><text y="-10" class="n" font-size="25">FIELD</text><text y="24" class="n" font-size="25">RECEIPT</text></g></g><g class="edge"><line x1="345" y1="500" x2="405" y2="500"/><line x1="685" y1="500" x2="735" y2="500"/><line x1="1035" y1="500" x2="1075" y2="500"/><line x1="1355" y1="500" x2="1365" y2="500"/></g><text x="800" y="840" text-anchor="middle" class="t n" font-size="27">OBSERVATION IS NOT CERTIFICATION. A SENSOR READING IS NOT A SAFETY GUARANTEE.</text><text x="800" y="890" text-anchor="middle" class="t m" font-size="18">STARTER FIRMWARE + v0.2.2 SAFETY LINEAGE · INSTRUMENTED FIELD INSTALLATION STILL PLANNED</text></svg>