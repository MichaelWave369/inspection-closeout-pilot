<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Agentora Archive cover</title><desc id="desc">A human operator provides an intent contract and bounded memory context to a local-first team orchestration studio. Specialized computational collaborators produce plans, dissent, handoffs, and proposed actions. Approvals, guardrails, receipts, and operator controls determine what may proceed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020509"/><stop offset="1" stop-color="#123149"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#69baff"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#eff9ff}.s{font-weight:600;fill:#b6cad7}.n{font-weight:900;fill:#e9f7ff}.m{font-weight:700;fill:#9fb6c4}.box{fill:#081722;stroke:#448fc9;stroke-width:3}.gate{fill:#173326;stroke:#8ddcac;stroke-width:4}.human{fill:#342918;stroke:#f1ca79;stroke-width:4}.edge{fill:none;stroke:#69baff;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="105" class="t h" font-size="76">AGENTORA</text><text x="83" y="152" class="t s" font-size="24">LOCAL-FIRST COMPUTATIONAL COLLABORATOR OPERATING STUDIO · OPERATOR IN AUTHORITY</text><g class="t" text-anchor="middle"><g transform="translate(150 470)"><rect x="-105" y="-78" width="210" height="156" rx="25" class="human"/><text y="-28" class="n" font-size="24">HUMAN OPERATOR</text><text y="12" class="s" font-size="18">INTENT · AUTHORITY</text><text y="42" class="s" font-size="18">PAUSE · APPROVE</text><text y="68" class="s" font-size="18">DENY · REPAIR</text></g><g transform="translate(405 470)"><rect x="-110" y="-78" width="220" height="156" rx="25" class="box"/><text y="-28" class="n" font-size="24">CONTEXT PACK</text><text y="12" class="s" font-size="18">GOAL · MEMORY</text><text y="42" class="s" font-size="18">LINEAGE · CONSTRAINTS</text><text y="68" class="s" font-size="18">SOURCE CONFIDENCE</text></g><g transform="translate(680 470)"><rect x="-125" y="-90" width="250" height="180" rx="28" class="box"/><text y="-45" class="n" font-size="24">TEAM ORCHESTRATION</text><text y="-5" class="s" font-size="18">PLAN · SUBGOALS</text><text y="25" class="s" font-size="18">SPECIALIZED ROLES</text><text y="55" class="s" font-size="18">HANDOFFS · DISSENT</text><text y="82" class="s" font-size="18">COLLABORATION TRACE</text></g><g transform="translate(965 470)"><rect x="-115" y="-82" width="230" height="164" rx="26" class="gate"/><text y="-36" class="n" font-size="24">ACTION GATE</text><text y="4" class="s" font-size="18">ALLOWLIST · POLICY</text><text y="34" class="s" font-size="18">APPROVE · DENY</text><text y="64" class="s" font-size="18">PATH · DOMAIN · APP</text></g><g transform="translate(1230 470)"><rect x="-115" y="-78" width="230" height="156" rx="25" class="box"/><text y="-28" class="n" font-size="24">OPERATOR MODE</text><text y="12" class="s" font-size="18">RUN · PAUSE · RESUME</text><text y="42" class="s" font-size="18">ADVANCE · RETRY</text><text y="68" class="s" font-size="18">SKIP · REPLAY</text></g><g transform="translate(1465 470)"><rect x="-100" y="-78" width="200" height="156" rx="25" class="box"/><text y="-28" class="n" font-size="24">RECEIPT</text><text y="12" class="s" font-size="18">TRACE · OUTCOME</text><text y="42" class="s" font-size="18">EXCEPTION</text><text y="68" class="s" font-size="18">WRITEBACK CHOICE</text></g></g><path class="edge" d="M255 470H295"/><path class="edge" d="M515 470H555"/><path class="edge" d="M805 470H850"/><path class="edge" d="M1080 470H1115"/><path class="edge" d="M1345 470H1365"/><g class="t"><text x="80" y="748" class="n" font-size="31">COORDINATION DOES NOT CREATE AUTHORITY.</text><text x="80" y="800" class="s" font-size="22">Memory is context, not truth · a team trace is not proof of independent judgment · a score is not a verdict</text><text x="80" y="860" class="n" font-size="28">THE OPERATOR MAY STOP, DENY, REPAIR, OR REFUSE WRITEBACK.</text><text x="80" y="920" class="m" font-size="18">PUBLIC ARCHIVE DEMO: FIXED SYNTHETIC DATA ONLY · NO MODEL CALLS · NO ACTIONS · NO MEMORY WRITE · NO WORKER DISPATCH</text></g></svg>