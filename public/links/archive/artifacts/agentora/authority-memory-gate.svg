<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Agentora authority and memory gate</title><desc id="desc">Retrieved memory, team proposals, heuristic scores, and worker results remain advisory. A human operator reviews source lineage, conflicts, action policy, approval scope, reversibility, and writeback choice before any consequential step.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020509"/><stop offset="1" stop-color="#102e43"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#eff9ff}.s{font-weight:600;fill:#b6cad7}.n{font-weight:900;fill:#e9f7ff}.m{font-weight:700;fill:#9fb6c4}.ring{fill:none;stroke:#69baff;stroke-width:5}.gate{fill:#081722;stroke:#448fc9;stroke-width:3}.human{fill:#342918;stroke:#f1ca79;stroke-width:4}.good{fill:#173326;stroke:#8ddcac;stroke-width:4}.stop{fill:#361922;stroke:#ff929b;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">AUTHORITY + MEMORY GATE</text><text x="78" y="140" class="t s" font-size="23">Useful context remains inspectable, correctable, and subordinate to operator authority.</text><g transform="translate(790 465)"><circle r="265" class="ring" opacity=".22"/><circle r="180" class="ring" opacity=".45"/><rect x="-155" y="-100" width="310" height="200" rx="36" class="human"/><text y="-46" text-anchor="middle" class="t n" font-size="30">HUMAN OPERATOR</text><text y="-3" text-anchor="middle" class="t s" font-size="19">APPROVE · DENY · PAUSE</text><text y="31" text-anchor="middle" class="t s" font-size="19">CORRECT · ESCALATE · REPAIR</text><text y="66" text-anchor="middle" class="t s" font-size="19">WRITE BACK OR DECLINE</text></g><g class="t" text-anchor="middle"><g transform="translate(790 180)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">INTENT + AUTHORITY</text></g><g transform="translate(1110 260)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">MEMORY LINEAGE</text></g><g transform="translate(1240 495)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">CONFLICTS + DUPLICATES</text></g><g transform="translate(1095 720)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">REVERSIBILITY</text></g><g transform="translate(485 720)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">ACTION POLICY</text></g><g transform="translate(340 495)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">APPROVAL SCOPE</text></g><g transform="translate(470 260)"><rect x="-130" y="-43" width="260" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">DISSENT + ALTERNATIVES</text></g></g><g transform="translate(1420 700)"><rect x="-125" y="-75" width="250" height="150" rx="25" class="stop"/><text y="-25" text-anchor="middle" class="t n" font-size="24">NO IMPLIED TRUTH</text><text y="16" text-anchor="middle" class="t s" font-size="17">MEMORY · SCORE · PLAN</text><text y="47" text-anchor="middle" class="t s" font-size="17">WORKER OUTPUT · CONSENSUS</text></g><text x="80" y="840" class="t m" font-size="18">A TEAM MAY SHARE THE SAME MODEL FAMILY, TRAINING BIASES, CONTEXT ERRORS, OR ORCHESTRATOR ASSUMPTIONS. ROLE LABELS ALONE DO NOT PROVE INDEPENDENCE.</text></svg>