<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Agentora mission lifecycle</title><desc id="desc">An operator prepares context, launches a bounded mission, observes team traces and proposed actions, pauses or advances execution, reviews outcome evidence, and chooses whether to write a summary back to memory.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020509"/><stop offset="1" stop-color="#102e43"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#69baff"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#eff9ff}.s{font-weight:600;fill:#b6cad7}.n{font-weight:900;fill:#e9f7ff}.m{font-weight:700;fill:#9fb6c4}.box{fill:#081722;stroke:#448fc9;stroke-width:3}.good{fill:#173326;stroke:#8ddcac;stroke-width:4}.human{fill:#342918;stroke:#f1ca79;stroke-width:4}.stop{fill:#361922;stroke:#ff929b;stroke-width:4}.edge{fill:none;stroke:#69baff;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">AGENTORA MISSION LIFECYCLE</text><text x="78" y="140" class="t s" font-size="23">Prepare → launch → observe → control → review → optional writeback.</text><g class="t" text-anchor="middle"><g transform="translate(145 390)"><rect x="-105" y="-70" width="210" height="140" rx="24" class="human"/><text y="-18" class="n" font-size="24">PREPARE</text><text y="20" class="s" font-size="18">INTENT · REPO</text><text y="48" class="s" font-size="18">PERSONA · BOUNDARY</text></g><g transform="translate(385 390)"><rect x="-105" y="-70" width="210" height="140" rx="24" class="box"/><text y="-18" class="n" font-size="24">LAUNCH</text><text y="20" class="s" font-size="18">PLAN · SUBGOALS</text><text y="48" class="s" font-size="18">ASSIGNED ROLES</text></g><g transform="translate(625 390)"><rect x="-105" y="-70" width="210" height="140" rx="24" class="box"/><text y="-18" class="n" font-size="24">OBSERVE</text><text y="20" class="s" font-size="18">TRACES · HANDOFFS</text><text y="48" class="s" font-size="18">PENDING ACTIONS</text></g><g transform="translate(865 390)"><rect x="-105" y="-78" width="210" height="156" rx="25" class="human"/><text y="-28" class="n" font-size="24">CONTROL</text><text y="12" class="s" font-size="18">PAUSE · RESUME</text><text y="42" class="s" font-size="18">ADVANCE · RETRY</text><text y="68" class="s" font-size="18">SKIP · DENY</text></g><g transform="translate(1105 390)"><rect x="-105" y="-70" width="210" height="140" rx="24" class="good"/><text y="-18" class="n" font-size="24">REVIEW</text><text y="20" class="s" font-size="18">OUTCOME · EVIDENCE</text><text y="48" class="s" font-size="18">EXCEPTIONS · RISKS</text></g><g transform="translate(1345 390)"><rect x="-105" y="-78" width="210" height="156" rx="25" class="box"/><text y="-28" class="n" font-size="24">WRITEBACK?</text><text y="12" class="s" font-size="18">SUMMARY · DETAILS</text><text y="42" class="s" font-size="18">MANUAL BY DEFAULT</text><text y="68" class="s" font-size="18">DECLINE ALLOWED</text></g></g><path class="edge" d="M250 390H280"/><path class="edge" d="M490 390H520"/><path class="edge" d="M730 390H760"/><path class="edge" d="M970 390H1000"/><path class="edge" d="M1210 390H1240"/><g transform="translate(860 650)"><rect x="-190" y="-62" width="380" height="124" rx="22" class="stop"/><text y="-14" text-anchor="middle" class="t n" font-size="25">STOP / REPAIR / ESCALATE</text><text y="25" text-anchor="middle" class="t s" font-size="18">ANY STAGE MAY HALT WITHOUT FORCING COMPLETION</text></g><path class="edge" d="M865 468V588"/><text x="80" y="810" class="t n" font-size="27">BACKGROUND WATCHING, AUTO-WRITEBACK, MCP EXPOSURE, ALERTS, AND WORKER ASSIST ARE OPTIONAL AND ENV-GATED.</text><text x="80" y="855" class="t m" font-size="18">THE PUBLIC WORKBENCH USES NONE OF THEM. IT DOES NOT CONNECT TO PHIOS, AGENTCEPTION, OLLAMA, A WORKER NODE, OR A DESKTOP/BROWSER ACTION LAYER.</text></svg>