<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AlphaLedgerOmega ledger family map</title><desc id="desc">Nine specialized ledger families surround a shared receipt grammar.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050907"/><stop offset="1" stop-color="#112c1e"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effff4}.s{font-weight:600;fill:#abc8b5}.n{font-weight:900;fill:#dcffe8}.m{font-weight:700;fill:#8fb9a0}.box{fill:#0a1710;stroke:#4fb979;stroke-width:3}.core{fill:#153b28;stroke:#9af1b6;stroke-width:5}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="85" y="98" class="t h" font-size="62">ALO LEDGER FAMILY MAP</text><text x="88" y="143" class="t s" font-size="23">Specialized evidence domains. One shared receipt grammar. No universal evidence shortcut.</text><g class="t" text-anchor="middle"><rect x="585" y="325" width="430" height="220" rx="34" class="core"/><text x="800" y="385" class="n" font-size="34">SHARED RECEIPT ENVELOPE</text><text x="800" y="430" class="s" font-size="20">identity · source · authority · event</text><text x="800" y="465" class="s" font-size="20">before · after · claim · uncertainty</text><text x="800" y="500" class="s" font-size="20">dissent · custody · integrity · repair</text><g transform="translate(235 240)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">PROTEO</text><text y="28" class="m" font-size="16">biological proteins</text></g><g transform="translate(545 210)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">ELEMENT</text><text y="28" class="m" font-size="16">chemical elements</text></g><g transform="translate(870 190)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">ATOM</text><text y="28" class="m" font-size="16">atomic-scale records</text></g><g transform="translate(1190 215)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">CIRCUIT</text><text y="28" class="m" font-size="16">compute and execution</text></g><g transform="translate(1370 430)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">NEURO</text><text y="28" class="m" font-size="16">human-context continuity</text></g><g transform="translate(1215 680)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">MATERIAL</text><text y="28" class="m" font-size="16">materials and fabrication</text></g><g transform="translate(870 720)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">SPATIAL</text><text y="28" class="m" font-size="16">place and geometry</text></g><g transform="translate(520 700)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">ENERGY</text><text y="28" class="m" font-size="16">power and physical tests</text></g><g transform="translate(220 470)"><rect x="-130" y="-65" width="260" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="28">DATACENTER</text><text y="28" class="m" font-size="16">infrastructure and custody</text></g></g><text x="800" y="860" text-anchor="middle" class="t s" font-size="18">FAMILY NAMES ORGANIZE EVIDENCE. THEY DO NOT MAKE DIFFERENT DOMAINS EQUIVALENT.</text></svg>