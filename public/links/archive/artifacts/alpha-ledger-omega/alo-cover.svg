<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">AlphaLedgerOmega Archive cover</title><desc id="desc">A central receipt envelope links claims, sources, authority, actions, custody, verification, uncertainty, repair, and nine specialized ledger families.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030705"/><stop offset="1" stop-color="#10291c"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effff4}.s{font-weight:600;fill:#abc8b5}.n{font-weight:900;fill:#dcffe8}.m{font-weight:700;fill:#8fb9a0}.edge{stroke:#72e09d;stroke-width:4;opacity:.65}.box{fill:#0a1710;stroke:#4fb979;stroke-width:3}.core{fill:#153b28;stroke:#9af1b6;stroke-width:5}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="82" y="105" class="t h" font-size="72">ALPHALEDGEROMEGA</text><text x="86" y="152" class="t s" font-size="24">Evidence continuity from observation to claim—without laundering uncertainty into truth.</text><g transform="translate(800 500)"><circle r="300" fill="none" stroke="#4fb979" stroke-width="2" opacity=".34"/><rect x="-190" y="-105" width="380" height="210" rx="34" class="core"/><text y="-35" text-anchor="middle" class="t n" font-size="34">RECEIPT ENVELOPE</text><text y="10" text-anchor="middle" class="t s" font-size="20">SOURCE · AUTHORITY · EVENT</text><text y="45" text-anchor="middle" class="t s" font-size="20">BEFORE · AFTER · CLAIM</text><text y="80" text-anchor="middle" class="t s" font-size="20">UNCERTAINTY · REPAIR</text></g><g class="t" text-anchor="middle"><g transform="translate(800 220)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">CLAIM</text></g><g transform="translate(1125 285)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">SOURCE</text></g><g transform="translate(1300 510)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">AUTHORITY</text></g><g transform="translate(1125 735)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">ACTION</text></g><g transform="translate(800 800)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">REPAIR</text></g><g transform="translate(475 735)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">CUSTODY</text></g><g transform="translate(300 510)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">VERIFY</text></g><g transform="translate(475 285)"><rect x="-105" y="-40" width="210" height="80" rx="18" class="box"/><text y="8" class="n" font-size="22">UNCERTAINTY</text></g></g><g class="edge"><line x1="800" y1="260" x2="800" y2="395"/><line x1="1035" y1="325" x2="930" y2="420"/><line x1="1195" y1="510" x2="990" y2="510"/><line x1="1035" y1="695" x2="930" y2="580"/><line x1="800" y1="760" x2="800" y2="605"/><line x1="565" y1="695" x2="670" y2="580"/><line x1="405" y1="510" x2="610" y2="510"/><line x1="565" y1="325" x2="670" y2="420"/></g><text x="800" y="930" text-anchor="middle" class="t n" font-size="24">PROTEO · ELEMENT · ATOM · CIRCUIT · NEURO · MATERIAL · SPATIAL · ENERGY · DATACENTER</text><text x="800" y="970" text-anchor="middle" class="t m" font-size="17">A COMPLETE RECEIPT CAN STILL DESCRIBE A FALSE CLAIM. EVIDENCE QUALITY REMAINS INSPECTABLE.</text></svg>