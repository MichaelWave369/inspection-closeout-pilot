<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Anatomy of an AlphaLedgerOmega receipt</title><desc id="desc">A receipt envelope is divided into identity, source, authority, event, state transition, claims, uncertainty, dissent, integrity, and repair.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030705"/><stop offset="1" stop-color="#0e2519"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effff4}.s{font-weight:600;fill:#abc8b5}.n{font-weight:900;fill:#dcffe8}.m{font-weight:700;fill:#8fb9a0}.box{fill:#09150e;stroke:#4fb979;stroke-width:2}.warn{fill:#2a2111;stroke:#efc77b;stroke-width:3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="96" class="t h" font-size="62">ANATOMY OF A RECEIPT</text><text x="83" y="140" class="t s" font-size="23">A record is useful when a reviewer can inspect both what it supports and what it cannot support.</text><g class="t"><rect x="90" y="205" width="1420" height="525" rx="36" fill="#07110c" stroke="#72e09d" stroke-width="4"/><g transform="translate(130 250)"><rect width="300" height="160" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">IDENTITY</text><text x="25" y="78" class="m" font-size="17">receipt ID · family · schema</text><text x="25" y="108" class="m" font-size="17">time · actor · subject</text></g><g transform="translate(455 250)"><rect width="300" height="160" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">SOURCE &amp; CUSTODY</text><text x="25" y="78" class="m" font-size="17">origin · locator · raw record</text><text x="25" y="108" class="m" font-size="17">who held which bytes</text></g><g transform="translate(780 250)"><rect width="300" height="160" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">AUTHORITY</text><text x="25" y="78" class="m" font-size="17">mandate · scope · status</text><text x="25" y="108" class="m" font-size="17">what could be changed</text></g><g transform="translate(1105 250)"><rect width="300" height="160" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">EVENT</text><text x="25" y="78" class="m" font-size="17">observation · decision · action</text><text x="25" y="108" class="m" font-size="17">what actually occurred</text></g><g transform="translate(130 435)"><rect width="300" height="205" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">STATE TRANSITION</text><text x="25" y="80" class="m" font-size="17">before → after</text><text x="25" y="112" class="m" font-size="17">changed · unchanged · missing</text><text x="25" y="144" class="m" font-size="17">repair or supersession</text></g><g transform="translate(455 435)"><rect width="300" height="205" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">CLAIM BOUNDARY</text><text x="25" y="80" class="m" font-size="17">supports</text><text x="25" y="112" class="m" font-size="17">does not support</text><text x="25" y="144" class="m" font-size="17">conditions and scope</text></g><g transform="translate(780 435)"><rect width="300" height="205" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">UNCERTAINTY &amp; DISSENT</text><text x="25" y="80" class="m" font-size="17">unknowns · conflicts</text><text x="25" y="112" class="m" font-size="17">protected objections</text><text x="25" y="144" class="m" font-size="17">failure and repair conditions</text></g><g transform="translate(1105 435)"><rect width="300" height="205" rx="22" class="box"/><text x="25" y="42" class="n" font-size="23">INTEGRITY</text><text x="25" y="80" class="m" font-size="17">digest · manifest · signature</text><text x="25" y="112" class="m" font-size="17">verification result</text><text x="25" y="144" class="m" font-size="17">integrity ≠ truth</text></g></g><rect x="260" y="775" width="1080" height="76" rx="20" class="warn"/><text x="800" y="810" text-anchor="middle" class="t n" font-size="22">A COMPLETE RECEIPT CAN BE INTERNALLY CONSISTENT AND STILL RECORD A FALSE OR WEAK CLAIM.</text><text x="800" y="838" text-anchor="middle" class="t s" font-size="16">VERIFY THE BYTES. THEN EVALUATE THE SOURCE, METHOD, AUTHORITY, AND CLAIM SEPARATELY.</text></svg>