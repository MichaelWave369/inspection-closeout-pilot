<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Sovereign Office Architecture Archive cover</title><desc id="desc">Six separated offices surround a human authority core: Observer, Cartographer, Protected Dissenter, Governor, Operator, and Repairer.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03060c"/><stop offset="1" stop-color="#14264b"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f3f7ff}.s{font-weight:600;fill:#afbed5}.n{font-weight:900;fill:#e8f2ff}.m{font-weight:700;fill:#9fb0ca}.box{fill:#0b1428;stroke:#6d9fff;stroke-width:3}.d{fill:#27193f;stroke:#c29cff;stroke-width:4}.core{fill:#123844;stroke:#70dfdc;stroke-width:5}.edge{stroke:#70dfdc;stroke-width:4;opacity:.55}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="78" y="105" class="t h" font-size="68">SOVEREIGN OFFICE ARCHITECTURE</text><text x="82" y="150" class="t s" font-size="23">Separated judgments. Protected dissent. Explicit authority. Bounded execution. Receipted repair.</text><g transform="translate(800 520)"><circle r="310" fill="none" stroke="#6d9fff" stroke-width="2" opacity=".3"/><rect x="-190" y="-95" width="380" height="190" rx="36" class="core"/><text y="-30" text-anchor="middle" class="t n" font-size="34">HUMAN AUTHORITY</text><text y="15" text-anchor="middle" class="t s" font-size="20">PURPOSE · MANDATE · LIMITS</text><text y="50" text-anchor="middle" class="t s" font-size="20">ACCEPT · REJECT · PAUSE · REPAIR</text></g><g class="t" text-anchor="middle"><g transform="translate(800 205)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">OBSERVER</text></g><g transform="translate(1165 340)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">CARTOGRAPHER</text></g><g transform="translate(1165 700)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="d"/><text y="8" class="n" font-size="24">PROTECTED DISSENTER</text></g><g transform="translate(800 835)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">GOVERNOR</text></g><g transform="translate(435 700)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">OPERATOR</text></g><g transform="translate(435 340)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">REPAIRER</text></g></g><g class="edge"><line x1="800" y1="253" x2="800" y2="425"/><line x1="1035" y1="370" x2="958" y2="445"/><line x1="1035" y1="670" x2="960" y2="595"/><line x1="800" y1="787" x2="800" y2="615"/><line x1="565" y1="670" x2="640" y2="595"/><line x1="565" y1="370" x2="642" y2="445"/></g><text x="800" y="950" text-anchor="middle" class="t n" font-size="24">AGREEMENT IS NOT AUTHORITY · DISSENT IS NOT DECORATION · EXECUTION IS BOUNDED</text></svg>