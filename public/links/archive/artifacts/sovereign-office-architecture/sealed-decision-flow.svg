<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SOSA sealed decision flow</title><desc id="desc">A decision packet moves through sealed office judgments, synthesis, authority, bounded operator execution, receipt, and repair while dissent remains attached.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03060c"/><stop offset="1" stop-color="#14264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#70dfdc"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2f7ff}.s{font-weight:600;fill:#afbed5}.n{font-weight:900;fill:#e6f0ff}.m{font-weight:700;fill:#9fb0ca}.box{fill:#0b1428;stroke:#6d9fff;stroke-width:3}.d{fill:#281a40;stroke:#c29cff;stroke-width:4}.human{fill:#123844;stroke:#70dfdc;stroke-width:4}.edge{stroke:#70dfdc;stroke-width:5;fill:none;marker-end:url(#a)}.back{stroke:#c29cff;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="78" y="92" class="t h" font-size="60">DECISION PACKET → SEALED JUDGMENTS → RECEIPT</text><text x="80" y="136" class="t s" font-size="22">A complete decision object preserves who observed, who objected, who authorized, what changed, and how repair remains possible.</text><g class="t" text-anchor="middle"><g transform="translate(130 420)"><rect x="-95" y="-70" width="190" height="140" rx="22" class="box"/><text y="-15" class="n" font-size="22">DECISION</text><text y="18" class="n" font-size="22">PACKET</text><text y="50" class="m" font-size="15">GOAL · EVIDENCE · SCOPE</text></g><g transform="translate(370 420)"><rect x="-105" y="-70" width="210" height="140" rx="22" class="box"/><text y="-12" class="n" font-size="22">SEALED OFFICE</text><text y="20" class="n" font-size="22">JUDGMENTS</text><text y="51" class="m" font-size="15">SEPARATE · TIMESTAMPED</text></g><g transform="translate(610 420)"><rect x="-95" y="-70" width="190" height="140" rx="22" class="d"/><text y="-12" class="n" font-size="22">SYNTHESIS</text><text y="20" class="n" font-size="22">+ DISSENT</text><text y="51" class="m" font-size="15">NO ERASURE</text></g><g transform="translate(850 420)"><rect x="-105" y="-70" width="210" height="140" rx="22" class="human"/><text y="-12" class="n" font-size="22">HUMAN</text><text y="20" class="n" font-size="22">AUTHORITY</text><text y="51" class="m" font-size="15">ACCEPT · NARROW · PAUSE</text></g><g transform="translate(1090 420)"><rect x="-105" y="-70" width="210" height="140" rx="22" class="box"/><text y="-12" class="n" font-size="22">BOUNDED</text><text y="20" class="n" font-size="22">OPERATION</text><text y="51" class="m" font-size="15">ENVELOPE · OVERRIDE</text></g><g transform="translate(1330 420)"><rect x="-105" y="-70" width="210" height="140" rx="22" class="box"/><text y="-12" class="n" font-size="22">RECEIPT</text><text y="20" class="n" font-size="22">+ REPAIR</text><text y="51" class="m" font-size="15">RESULT · ROLLBACK · REPLAY</text></g></g><g class="edge"><line x1="225" y1="420" x2="260" y2="420"/><line x1="475" y1="420" x2="510" y2="420"/><line x1="705" y1="420" x2="740" y2="420"/><line x1="955" y1="420" x2="980" y2="420"/><line x1="1195" y1="420" x2="1220" y2="420"/></g><path d="M1330 500C1260 720 910 760 610 515" class="back"/><text x="1020" y="735" text-anchor="middle" class="t n" font-size="22">FAILURE AND REPAIR RETURN TO THE DECISION RECORD—NOT TO OBLIVION</text><g transform="translate(245 625)" class="t"><rect width="1110" height="92" rx="20" fill="#0a1324" stroke="#c29cff" stroke-width="3"/><text x="555" y="38" text-anchor="middle" class="n" font-size="23">FREEZE DRIFT: NO UNRECORDED SCOPE EXPANSION, MANDATE EXTENSION, OR AUTHORITY LEAK</text><text x="555" y="68" text-anchor="middle" class="s" font-size="17">Every material change requires a new packet, judgment path, authority check, and receipt.</text></g></svg>