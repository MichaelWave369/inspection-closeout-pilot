<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AgentCeption execution lifecycle</title><desc id="desc">A bounded software mission moves through contract validation, isolated worktree creation, implementation, checks, evidence packaging, pull request candidacy, and human review. Any failed gate routes to repair or closure.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030507"/><stop offset="1" stop-color="#30200f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ffaa48"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff8ed}.s{font-weight:600;fill:#d2c1aa}.n{font-weight:900;fill:#fff4e5}.m{font-weight:700;fill:#c6b49e}.box{fill:#101923;stroke:#d98d39;stroke-width:3}.gate{fill:#183226;stroke:#88dda5;stroke-width:4}.stop{fill:#391a21;stroke:#ff8f99;stroke-width:4}.edge{fill:none;stroke:#ffaa48;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">SOFTWARE DELIVERY LIFECYCLE</text><text x="78" y="140" class="t s" font-size="23">Every transition preserves scope, authority, evidence, exceptions, and a stop path.</text><g class="t" text-anchor="middle"><g transform="translate(150 370)"><rect x="-105" y="-70" width="210" height="140" rx="23" class="box"/><text y="-18" class="n" font-size="23">CONTRACT</text><text y="20" class="s" font-size="17">REPO · BASE · GOAL</text><text y="48" class="s" font-size="17">ALLOWED / FORBIDDEN</text></g><g transform="translate(390 370)"><rect x="-105" y="-70" width="210" height="140" rx="23" class="gate"/><text y="-18" class="n" font-size="23">PREFLIGHT</text><text y="20" class="s" font-size="17">CLEAN BASE · ACCESS</text><text y="48" class="s" font-size="17">SECRETS · NETWORK</text></g><g transform="translate(630 370)"><rect x="-105" y="-70" width="210" height="140" rx="23" class="box"/><text y="-18" class="n" font-size="23">WORKTREE</text><text y="20" class="s" font-size="17">ISOLATED BRANCH</text><text y="48" class="s" font-size="17">COMMAND RECEIPTS</text></g><g transform="translate(870 370)"><rect x="-105" y="-70" width="210" height="140" rx="23" class="box"/><text y="-18" class="n" font-size="23">IMPLEMENT</text><text y="20" class="s" font-size="17">PATCH · ARTIFACTS</text><text y="48" class="s" font-size="17">ISSUES · ASSUMPTIONS</text></g><g transform="translate(1110 370)"><rect x="-105" y="-70" width="210" height="140" rx="23" class="gate"/><text y="-18" class="n" font-size="23">VERIFY</text><text y="20" class="s" font-size="17">TEST · LINT · BUILD</text><text y="48" class="s" font-size="17">DIFF · POLICY</text></g><g transform="translate(1360 370)"><rect x="-120" y="-78" width="240" height="156" rx="25" class="box"/><text y="-28" class="n" font-size="23">DELIVERY PACKET</text><text y="12" class="s" font-size="17">SUMMARY · CHECKS</text><text y="42" class="s" font-size="17">RISKS · FAILURES</text><text y="68" class="s" font-size="17">PR CANDIDATE STATE</text></g></g><path class="edge" d="M255 370H285"/><path class="edge" d="M495 370H525"/><path class="edge" d="M735 370H765"/><path class="edge" d="M975 370H1005"/><path class="edge" d="M1215 370H1240"/><g class="t" text-anchor="middle"><g transform="translate(520 670)"><rect x="-150" y="-65" width="300" height="130" rx="24" class="stop"/><text y="-15" class="n" font-size="24">BLOCK / REPAIR</text><text y="24" class="s" font-size="18">NO HIDDEN CONTINUATION</text><text y="51" class="s" font-size="18">RETAIN FAILURE RECEIPT</text></g><g transform="translate(1080 670)"><rect x="-165" y="-65" width="330" height="130" rx="24" class="gate"/><text y="-15" class="n" font-size="24">HUMAN REVIEW QUEUE</text><text y="24" class="s" font-size="18">MERGE · REJECT · REQUEST CHANGES</text><text y="51" class="s" font-size="18">DEPLOYMENT REMAINS SEPARATE</text></g></g><path class="edge" d="M390 440L500 605"/><path class="edge" d="M1110 440L1065 605"/><text x="80" y="835" class="t m" font-size="18">WORKTREE CREATION, TEST PASSING, AND PR OPENING ARE DISTINCT EVENTS. NONE OF THEM PROVES CORRECTNESS OR AUTHORIZES THE NEXT EVENT.</text></svg>