<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AgentCeption review and merge gate</title><desc id="desc">A pull request candidate must pass declared checks, preserve scope, expose risks and failures, receive human review, and satisfy repository policy before merge. Deployment and outcome verification remain separate later decisions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030507"/><stop offset="1" stop-color="#30200f"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff8ed}.s{font-weight:600;fill:#d2c1aa}.n{font-weight:900;fill:#fff4e5}.m{font-weight:700;fill:#c6b49e}.gate{fill:#101923;stroke:#d98d39;stroke-width:3}.core{fill:#183226;stroke:#88dda5;stroke-width:4}.stop{fill:#391a21;stroke:#ff8f99;stroke-width:4}.human{fill:#352a18;stroke:#f3ca78;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">REVIEW, MERGE, AND DEPLOYMENT GATES</text><text x="78" y="140" class="t s" font-size="23">Evidence can support a decision. It cannot replace the decision-maker or collapse separate authorities into one event.</text><g transform="translate(800 455)"><circle r="260" fill="none" stroke="#ffaa48" stroke-width="5" opacity=".2"/><circle r="175" fill="none" stroke="#70d9e8" stroke-width="5" opacity=".4"/><rect x="-160" y="-100" width="320" height="200" rx="35" class="core"/><text y="-45" text-anchor="middle" class="t n" font-size="30">HUMAN MERGE GATE</text><text y="0" text-anchor="middle" class="t s" font-size="19">REPOSITORY POLICY</text><text y="34" text-anchor="middle" class="t s" font-size="19">REVIEW + REQUIRED CHECKS</text><text y="68" text-anchor="middle" class="t s" font-size="19">RISKS + DISSENT VISIBLE</text></g><g class="t" text-anchor="middle"><g transform="translate(800 175)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">SCOPE PRESERVED</text></g><g transform="translate(1130 265)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">CHECKS REPORTED</text></g><g transform="translate(1260 505)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">FAILURES VISIBLE</text></g><g transform="translate(1110 735)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">BASE STILL CURRENT</text></g><g transform="translate(490 735)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">REVIEW AUTHORITY</text></g><g transform="translate(340 505)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">SECRETS PROTECTED</text></g><g transform="translate(470 265)"><rect x="-135" y="-43" width="270" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">DEPENDENCIES DECLARED</text></g></g><g transform="translate(1425 690)"><rect x="-125" y="-75" width="250" height="150" rx="25" class="stop"/><text y="-24" text-anchor="middle" class="t n" font-size="24">HOLD / REPAIR</text><text y="17" text-anchor="middle" class="t s" font-size="17">NO AUTO-MERGE</text><text y="47" text-anchor="middle" class="t s" font-size="17">RETAIN RECEIPT</text></g><g transform="translate(175 690)"><rect x="-125" y="-75" width="250" height="150" rx="25" class="human"/><text y="-24" text-anchor="middle" class="t n" font-size="24">AFTER MERGE</text><text y="17" text-anchor="middle" class="t s" font-size="17">DEPLOYMENT GATE</text><text y="47" text-anchor="middle" class="t s" font-size="17">OUTCOME VERIFICATION</text></g><text x="80" y="840" class="t m" font-size="18">PR OPENED ≠ REVIEWED ≠ MERGED ≠ DEPLOYED ≠ VERIFIED SUCCESS. EACH TRANSITION REQUIRES ITS OWN AUTHORITY AND RECEIPT.</text></svg>