<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">AgentCeption Archive cover</title><desc id="desc">A governed software mission enters a dispatch gate, runs in an isolated worktree, produces code and test evidence, and may create a pull request candidate for human review. No branch or pull request grants merge or deployment authority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030507"/><stop offset="1" stop-color="#3b2510"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ffaa48"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff8ed}.s{font-weight:600;fill:#d2c1aa}.n{font-weight:900;fill:#fff4e5}.m{font-weight:700;fill:#c6b49e}.box{fill:#101923;stroke:#d98d39;stroke-width:3}.gate{fill:#183226;stroke:#88dda5;stroke-width:4}.human{fill:#352a18;stroke:#f3ca78;stroke-width:4}.edge{fill:none;stroke:#ffaa48;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="105" class="t h" font-size="74">AGENTCEPTION</text><text x="83" y="152" class="t s" font-size="24">ISOLATED SOFTWARE EXECUTION · EVIDENCE-RICH DELIVERY · HUMAN REVIEW</text><g class="t" text-anchor="middle"><g transform="translate(145 470)"><rect x="-105" y="-78" width="210" height="156" rx="25" class="human"/><text y="-28" class="n" font-size="24">MISSION CONTRACT</text><text y="12" class="s" font-size="18">REPO · BASE · SCOPE</text><text y="42" class="s" font-size="18">ALLOWED ACTIONS</text><text y="68" class="s" font-size="18">STOP CONDITIONS</text></g><g transform="translate(400 470)"><rect x="-110" y="-78" width="220" height="156" rx="25" class="gate"/><text y="-28" class="n" font-size="24">DISPATCH GATE</text><text y="12" class="s" font-size="18">AUTHORITY · SECRETS</text><text y="42" class="s" font-size="18">NETWORK · DEPENDENCIES</text><text y="68" class="s" font-size="18">RESOURCE LIMITS</text></g><g transform="translate(675 470)"><rect x="-125" y="-90" width="250" height="180" rx="28" class="box"/><text y="-45" class="n" font-size="24">ISOLATED WORKTREE</text><text y="-5" class="s" font-size="18">BRANCH · FILE SCOPE</text><text y="25" class="s" font-size="18">COMMAND LOG</text><text y="55" class="s" font-size="18">PATCH · ARTIFACTS</text><text y="82" class="s" font-size="18">NO DIRECT MAIN WRITE</text></g><g transform="translate(960 470)"><rect x="-115" y="-82" width="230" height="164" rx="26" class="box"/><text y="-36" class="n" font-size="24">CHECKS + RECEIPTS</text><text y="4" class="s" font-size="18">TESTS · LINT · BUILD</text><text y="34" class="s" font-size="18">DIFF · ISSUES</text><text y="64" class="s" font-size="18">FAILURES RETAINED</text></g><g transform="translate(1230 470)"><rect x="-115" y="-78" width="230" height="156" rx="25" class="gate"/><text y="-28" class="n" font-size="24">PR CANDIDATE</text><text y="12" class="s" font-size="18">SUMMARY · DIFF</text><text y="42" class="s" font-size="18">CHECK STATUS</text><text y="68" class="s" font-size="18">UNRESOLVED RISKS</text></g><g transform="translate(1460 470)"><rect x="-100" y="-78" width="200" height="156" rx="25" class="human"/><text y="-28" class="n" font-size="24">HUMAN REVIEW</text><text y="12" class="s" font-size="18">MERGE · REJECT</text><text y="42" class="s" font-size="18">REPAIR · CLOSE</text><text y="68" class="s" font-size="18">DEPLOY SEPARATELY</text></g></g><path class="edge" d="M250 470H290"/><path class="edge" d="M510 470H550"/><path class="edge" d="M800 470H845"/><path class="edge" d="M1075 470H1115"/><path class="edge" d="M1345 470H1360"/><g class="t"><text x="80" y="748" class="n" font-size="31">A PULL REQUEST IS A REVIEW OBJECT—NOT PERMISSION TO MERGE.</text><text x="80" y="800" class="s" font-size="22">Isolation is not correctness · checks are evidence, not proof · merge is not deployment · deployment is not verified outcome</text><text x="80" y="860" class="n" font-size="28">FAILURES, CONFLICTS, BLOCKERS, AND REJECTED WORK REMAIN PART OF THE RECEIPT.</text><text x="80" y="920" class="m" font-size="18">PUBLIC ARCHIVE DEMO: FIXED SYNTHETIC DATA ONLY · NO REPOSITORY ACCESS · NO SHELL · NO CODE EXECUTION · NO PR CREATION</text></g></svg>