<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MENDALA dual-loop water bench</title><desc id="desc">The next engineering proof: an instrumented root loop separated from a service and conditioning loop, connected through measured exchange and governed controls.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050a0f"/><stop offset="1" stop-color="#10271e"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#78dca1"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effff5}.s{font-weight:600;fill:#a8c8b4}.n{font-weight:900;fill:#d9ffe5}.m{font-weight:700;fill:#77dca0}.edge{fill:none;stroke:#78dca1;stroke-width:6;marker-end:url(#a)}.box{fill:#0b1713;stroke:#52aa75;stroke-width:3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="100" class="t h" font-size="62">NEXT ENGINEERING RECEIPT</text><text x="92" y="146" class="t s" font-size="24">Working dual-loop water bench before claims about a full growing system.</text><g class="t"><rect x="110" y="245" width="560" height="410" rx="34" class="box"/><text x="390" y="315" text-anchor="middle" class="n" font-size="34">ROOT / GROW LOOP</text><circle cx="255" cy="440" r="72" fill="#153d29" stroke="#8de6ab" stroke-width="3"/><text x="255" y="448" text-anchor="middle" class="m" font-size="20">ROOT ZONE</text><rect x="430" y="385" width="145" height="110" rx="18" fill="#102a20" stroke="#8de6ab"/><text x="502" y="430" text-anchor="middle" class="m" font-size="18">FLOW</text><text x="502" y="457" text-anchor="middle" class="m" font-size="18">SENSOR</text><path d="M325 440H420" class="edge"/><path d="M505 510C505 580 255 590 255 520" class="edge"/><rect x="930" y="245" width="560" height="410" rx="34" class="box"/><text x="1210" y="315" text-anchor="middle" class="n" font-size="34">SERVICE / CONDITION LOOP</text><rect x="1020" y="380" width="150" height="120" rx="20" fill="#102a20" stroke="#70b9ff"/><text x="1095" y="430" text-anchor="middle" class="s" font-size="18">FILTER</text><text x="1095" y="458" text-anchor="middle" class="s" font-size="18">RESERVOIR</text><rect x="1260" y="380" width="150" height="120" rx="20" fill="#102a20" stroke="#70b9ff"/><text x="1335" y="430" text-anchor="middle" class="s" font-size="18">NUTRIENT</text><text x="1335" y="458" text-anchor="middle" class="s" font-size="18">CONDITION</text><path d="M1178 440H1250" class="edge"/><path d="M1335 510C1335 580 1095 590 1095 510" class="edge"/><rect x="710" y="350" width="180" height="180" rx="30" fill="#78dca1"/><text x="800" y="414" text-anchor="middle" fill="#082014" font-size="22" font-weight="900">MEASURED</text><text x="800" y="448" text-anchor="middle" fill="#082014" font-size="22" font-weight="900">EXCHANGE</text><text x="800" y="490" text-anchor="middle" fill="#082014" font-size="16" font-weight="800">HUMAN OVERRIDE</text><path d="M670 440H700" class="edge"/><path d="M890 440H920" class="edge"/><text x="800" y="750" text-anchor="middle" class="n" font-size="28">RECORD FLOW · TEMPERATURE · pH/EC · LEAKS · UPTIME · MAINTENANCE</text><text x="800" y="805" text-anchor="middle" class="s" font-size="20">PASSING THIS BENCH DOES NOT VALIDATE CROP YIELD. IT VALIDATES THE WATER ARCHITECTURE.</text></g></svg>