<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MENDALA product family map</title><desc id="desc">A comparison of four full-size MENDALA models and three portable models, highlighting MENDALA-108 as the reference full-size design and Go-18 as the first serious portable prototype.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07100c"/><stop offset="1" stop-color="#12291f"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effff4}.s{font-weight:600;fill:#a8c9b4}.n{font-weight:900;fill:#d8ffe5}.k{font-weight:700;fill:#77e0a3}.box{fill:#0b1812;stroke:#4fb87b;stroke-width:2}.hot{fill:#123526;stroke:#9df1b8;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="85" y="95" class="t h" font-size="62">MENDALA PRODUCT FAMILY</text><text x="88" y="140" class="t s" font-size="23">One six-petal architecture scaled from portable learning systems to community foodwheels.</text><text x="95" y="225" class="t n" font-size="28">FULL-SIZE SYSTEMS</text><g class="t" text-anchor="middle"><g transform="translate(235 390)"><rect x="-145" y="-115" width="290" height="230" rx="25" class="box"/><text y="-45" class="h" font-size="34">MENDALA-24</text><text y="0" class="s" font-size="19">ENTRY FIXED UNIT</text><text y="45" class="k" font-size="18">COMPACT PILOT SCALE</text></g><g transform="translate(615 390)"><rect x="-145" y="-115" width="290" height="230" rx="25" class="box"/><text y="-45" class="h" font-size="34">MENDALA-48</text><text y="0" class="s" font-size="19">FIRST FIXED PILOT</text><text y="45" class="k" font-size="18">AFTER WATER BENCH</text></g><g transform="translate(995 390)"><rect x="-155" y="-125" width="310" height="250" rx="25" class="hot"/><text y="-48" class="h" font-size="38">MENDALA-108</text><text y="0" class="s" font-size="20">COMMUNITY FOODWHEEL</text><text y="48" class="k" font-size="19">REFERENCE CONFIGURATION</text></g><g transform="translate(1380 390)"><rect x="-145" y="-115" width="290" height="230" rx="25" class="box"/><text y="-45" class="h" font-size="34">MENDALA-216</text><text y="0" class="s" font-size="19">LARGER COMMUNITY</text><text y="45" class="k" font-size="18">FUTURE SCALE</text></g></g><text x="95" y="595" class="t n" font-size="28">PORTABLE SYSTEMS</text><g class="t" text-anchor="middle"><g transform="translate(300 735)"><rect x="-180" y="-85" width="360" height="170" rx="22" class="box"/><text y="-18" class="h" font-size="34">SEED-6</text><text y="28" class="s" font-size="18">HOUSEHOLD · CLASSROOM</text></g><g transform="translate(800 735)"><rect x="-200" y="-95" width="400" height="190" rx="22" class="hot"/><text y="-22" class="h" font-size="38">GO-18</text><text y="24" class="s" font-size="19">REFERENCE PORTABLE PROTOTYPE</text><text y="59" class="k" font-size="17">FIRST SERIOUS BUILD</text></g><g transform="translate(1310 735)"><rect x="-180" y="-85" width="360" height="170" rx="22" class="box"/><text y="-18" class="h" font-size="34">GO XL-36</text><text y="28" class="s" font-size="18">DEMO · EMERGENCY · RV</text></g></g></svg>