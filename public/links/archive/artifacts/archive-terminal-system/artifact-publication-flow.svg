<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Archive artifact publication flow</title><desc id="desc">The process from source discovery through review and publication into all six archive shells.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050a"/><stop offset="1" stop-color="#0c1322"/></linearGradient><style>.h{font:900 60px Arial;fill:#eef8ff}.s{font:600 21px Arial;fill:#9fb3c4}.n{font:900 24px Arial;fill:#eef8ff}.d{font:600 15px Arial;fill:#aabccc}.num{font:900 22px Arial;fill:#061019}.edge{stroke:#63e6e1;stroke-width:4;stroke-opacity:.55;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#63e6e1"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="105" class="h">ARTIFACT PUBLICATION FLOW</text><text x="90" y="148" class="s">Publish once into Archive Core. Every terminal inherits the approved state.</text><g><circle cx="160" cy="270" r="28" fill="#63e6e1"/><text x="160" y="278" text-anchor="middle" class="num">1</text><rect x="55" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="160" y="375" text-anchor="middle" class="n">DISCOVER</text><text x="160" y="422" text-anchor="middle" class="d"><tspan x="160">Locate the canonical</tspan><tspan x="160" dy="25">source file</tspan></text></g><line x1="272" y1="420" x2="301" y2="420" class="edge"/><g><circle cx="415" cy="270" r="28" fill="#63e6e1"/><text x="415" y="278" text-anchor="middle" class="num">2</text><rect x="310" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="415" y="375" text-anchor="middle" class="n">REVIEW</text><text x="415" y="422" text-anchor="middle" class="d"><tspan x="415">Confirm public-safe</tspan><tspan x="415" dy="25">content</tspan></text></g><line x1="527" y1="420" x2="556" y2="420" class="edge"/><g><circle cx="670" cy="270" r="28" fill="#63e6e1"/><text x="670" y="278" text-anchor="middle" class="num">3</text><rect x="565" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="670" y="375" text-anchor="middle" class="n">CLASSIFY</text><text x="670" y="422" text-anchor="middle" class="d"><tspan x="670">Set type, status,</tspan><tspan x="670" dy="25">and claim boundary</tspan></text></g><line x1="782" y1="420" x2="811" y2="420" class="edge"/><g><circle cx="925" cy="270" r="28" fill="#63e6e1"/><text x="925" y="278" text-anchor="middle" class="num">4</text><rect x="820" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="925" y="375" text-anchor="middle" class="n">PUBLISH</text><text x="925" y="422" text-anchor="middle" class="d"><tspan x="925">Create a stable</tspan><tspan x="925" dy="25">public artifact URL</tspan></text></g><line x1="1037" y1="420" x2="1066" y2="420" class="edge"/><g><circle cx="1180" cy="270" r="28" fill="#63e6e1"/><text x="1180" y="278" text-anchor="middle" class="num">5</text><rect x="1075" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="1180" y="375" text-anchor="middle" class="n">REGISTER</text><text x="1180" y="422" text-anchor="middle" class="d"><tspan x="1180">Attach artifact to</tspan><tspan x="1180" dy="25">the project record</tspan></text></g><line x1="1292" y1="420" x2="1321" y2="420" class="edge"/><g><circle cx="1435" cy="270" r="28" fill="#63e6e1"/><text x="1435" y="278" text-anchor="middle" class="num">6</text><rect x="1330" y="315" width="210" height="210" rx="24" fill="#0b1421" stroke="#67dce4" stroke-opacity=".4" stroke-width="2"/><text x="1435" y="375" text-anchor="middle" class="n">INHERIT</text><text x="1435" y="422" text-anchor="middle" class="d"><tspan x="1435">Six shells render</tspan><tspan x="1435" dy="25">the same truth</tspan></text></g><text x="800" y="705" text-anchor="middle" class="n">SOURCE → RECEIPT → PUBLICATION → CONTINUITY</text><text x="800" y="755" text-anchor="middle" class="s">Missing files remain missing. Design-stage work remains design-stage.</text><text x="800" y="790" text-anchor="middle" class="s">Published artifacts receive stable, inspectable routes.</text></svg>