<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Six-shell role map</title><desc id="desc">A circular map of the six Parallax Archive terminal roles around one Archive Core.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset="1" stop-color="#11172a"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66dfad"/><stop offset=".45" stop-color="#63e6e1"/><stop offset="1" stop-color="#9a7cff"/></linearGradient><style>.h{font:900 64px Arial,sans-serif;fill:#eef8ff}.s{font:700 21px Arial,sans-serif;fill:#9fb3c4}.n{font:900 26px Arial,sans-serif;fill:#eef8ff}.r{font:900 17px Arial,sans-serif;letter-spacing:3px}.d{font:600 17px Arial,sans-serif;fill:#a8bbca}.edge{stroke:#67dce4;stroke-opacity:.35;stroke-width:3}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><text x="90" y="112" class="h">SIX-SHELL ROLE MAP</text><text x="90" y="154" class="s">Presentation changes. Canonical project truth does not.</text>
<circle cx="800" cy="530" r="250" fill="none" stroke="#63e6e1" stroke-opacity=".18" stroke-width="2"/><circle cx="800" cy="530" r="142" fill="none" stroke="#9a7cff" stroke-opacity=".25" stroke-width="2"/>
<circle cx="800" cy="530" r="90" fill="url(#c)"/><text x="800" y="522" text-anchor="middle" style="font:900 28px Arial;fill:#061019">ARCHIVE</text><text x="800" y="560" text-anchor="middle" style="font:900 28px Arial;fill:#061019">CORE</text>
<line x1="800" y1="530" x2="800" y2="255" class="edge"/><circle cx="800" cy="255" r="86" fill="#0b1421" stroke="#d8e7d1" stroke-width="3"/><text x="800" y="243" text-anchor="middle" class="n">IBM 5100</text><text x="800" y="275" text-anchor="middle" class="r" fill="#d8e7d1">DISCOVERY</text><text x="800" y="366" text-anchor="middle" class="d">Research / catalog / mystery</text><line x1="800" y1="530" x2="1115" y2="395" class="edge"/><circle cx="1115" cy="395" r="86" fill="#0b1421" stroke="#78aaff" stroke-width="3"/><text x="1115" y="383" text-anchor="middle" class="n">SL1200</text><text x="1115" y="415" text-anchor="middle" class="r" fill="#78aaff">ORIGIN</text><text x="1115" y="506" text-anchor="middle" class="d">Memory / autobiography / beginning</text><line x1="800" y1="530" x2="1115" y2="665" class="edge"/><circle cx="1115" cy="665" r="86" fill="#0b1421" stroke="#63e6e1" stroke-width="3"/><text x="1115" y="653" text-anchor="middle" class="n">PAT Mk.1</text><text x="1115" y="685" text-anchor="middle" class="r" fill="#63e6e1">CREATION</text><text x="1115" y="776" text-anchor="middle" class="d">Field / graph / ledger / dissent</text><line x1="800" y1="530" x2="800" y2="795" class="edge"/><circle cx="800" cy="795" r="86" fill="#0b1421" stroke="#c0baff" stroke-width="3"/><text x="800" y="783" text-anchor="middle" class="n">Breadbox 64</text><text x="800" y="815" text-anchor="middle" class="r" fill="#c0baff">PLAY</text><text x="800" y="906" text-anchor="middle" class="d">Games / music / experiments</text><line x1="800" y1="530" x2="485" y2="665" class="edge"/><circle cx="485" cy="665" r="86" fill="#0b1421" stroke="#f0efe8" stroke-width="3"/><text x="485" y="653" text-anchor="middle" class="n">Gallery 128</text><text x="485" y="685" text-anchor="middle" class="r" fill="#f0efe8">GALLERY</text><text x="485" y="776" text-anchor="middle" class="d">Posters / design / exhibitions</text><line x1="800" y1="530" x2="485" y2="395" class="edge"/><circle cx="485" cy="395" r="86" fill="#0b1421" stroke="#b8e0a8" stroke-width="3"/><text x="485" y="383" text-anchor="middle" class="n">Field Luggable</text><text x="485" y="415" text-anchor="middle" class="r" fill="#b8e0a8">DEPLOYMENT</text><text x="485" y="506" text-anchor="middle" class="d">Field tech / evidence / operations</text><text x="800" y="976" text-anchor="middle" class="s">Every shell resolves the same IDs, artifacts, relationships, claim boundaries, and evidence states.</text></svg>