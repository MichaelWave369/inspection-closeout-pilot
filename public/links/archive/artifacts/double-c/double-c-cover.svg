<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Double C Computational Collaborator Archive cover</title><desc id="desc">A human and computational collaborator meet around a shared work surface. Human mandate, evidence, uncertainty, dissent, receipts, and bounded execution remain visible.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070309"/><stop offset="1" stop-color="#25112a"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d8bad0}.n{font-weight:900;fill:#ffe5f6}.m{font-weight:700;fill:#bca3b5}.human{fill:#34203b;stroke:#f59ad3;stroke-width:5}.cc{fill:#12343a;stroke:#7de4df;stroke-width:5}.work{fill:#171021;stroke:#8dbaff;stroke-width:3}.edge{stroke:#d7a9d0;stroke-width:5;opacity:.7}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="82" y="110" class="t h" font-size="78">DOUBLE C</text><text x="86" y="160" class="t s" font-size="28">COMPUTATIONAL COLLABORATOR</text><text x="88" y="205" class="t s" font-size="21">A public relationship term for bounded, inspectable human–computer collaboration.</text><g transform="translate(800 520)"><rect x="-245" y="-105" width="490" height="210" rx="38" class="work"/><text y="-42" text-anchor="middle" class="t n" font-size="33">SHARED WORK SURFACE</text><text y="5" text-anchor="middle" class="t s" font-size="20">INTENT · EVIDENCE · UNCERTAINTY</text><text y="42" text-anchor="middle" class="t s" font-size="20">DISSENT · RECEIPTS · REPAIR</text><text y="78" text-anchor="middle" class="t s" font-size="20">BOUNDED EXECUTION</text></g><g transform="translate(380 520)"><circle r="165" class="human"/><text y="-20" text-anchor="middle" class="t n" font-size="40">HUMAN</text><text y="25" text-anchor="middle" class="t s" font-size="22">MANDATE</text><text y="60" text-anchor="middle" class="t s" font-size="22">AUTHORITY</text></g><g transform="translate(1220 520)"><circle r="165" class="cc"/><text y="-20" text-anchor="middle" class="t n" font-size="40">CC</text><text y="25" text-anchor="middle" class="t s" font-size="22">OBSERVE · PROPOSE</text><text y="60" text-anchor="middle" class="t s" font-size="22">DRAFT · SIMULATE</text></g><line x1="545" y1="520" x2="555" y2="520" class="edge"/><line x1="1045" y1="520" x2="1055" y2="520" class="edge"/><g class="t" text-anchor="middle"><rect x="160" y="805" width="280" height="90" rx="22" class="work"/><text x="300" y="860" class="n" font-size="21">HUMAN-LED</text><rect x="500" y="805" width="280" height="90" rx="22" class="work"/><text x="640" y="860" class="n" font-size="21">RECEIPT-BACKED</text><rect x="840" y="805" width="280" height="90" rx="22" class="work"/><text x="980" y="860" class="n" font-size="21">DISAGREEMENT-SAFE</text><rect x="1180" y="805" width="280" height="90" rx="22" class="work"/><text x="1320" y="860" class="n" font-size="21">EASY TO EXIT</text></g><text x="800" y="965" text-anchor="middle" class="t m" font-size="17">DESIGN TERM · NOT PROOF OF CONSCIOUSNESS, PERSONHOOD, LEGAL AGENCY, OR TRUSTWORTHINESS</text></svg>