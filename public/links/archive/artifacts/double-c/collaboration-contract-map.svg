<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Double C collaboration contract map</title><desc id="desc">A human mandate becomes bounded computational work, proposals, review, authorization, execution, receipts, and repair. The computational collaborator never creates its own authority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08040a"/><stop offset="1" stop-color="#201125"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7de4df"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d4b8cc}.n{font-weight:900;fill:#ffe7f7}.m{font-weight:700;fill:#b89fb2}.box{fill:#130d18;stroke:#84547a;stroke-width:3}.human{fill:#351b38;stroke:#f598d3;stroke-width:4}.cc{fill:#103238;stroke:#7de4df;stroke-width:4}.edge{fill:none;stroke:#7de4df;stroke-width:5;marker-end:url(#a)}.return{fill:none;stroke:#f598d3;stroke-width:4;stroke-dasharray:12 10;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="62">DOUBLE C COLLABORATION CONTRACT</text><text x="82" y="140" class="t s" font-size="23">The label does not create safety. The visible mandate, evidence, authority, receipts, and exit path do.</text><g class="t" text-anchor="middle"><g transform="translate(150 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="human"/><text y="-12" class="n" font-size="24">HUMAN</text><text y="25" class="s" font-size="18">INTENT</text><text y="52" class="s" font-size="18">MANDATE</text></g><g transform="translate(390 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="box"/><text y="-12" class="n" font-size="23">BOUNDARY</text><text y="25" class="s" font-size="17">SCOPE · DATA</text><text y="52" class="s" font-size="17">TIME · EXIT</text></g><g transform="translate(630 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="cc"/><text y="-12" class="n" font-size="23">CC WORK</text><text y="25" class="s" font-size="17">OBSERVE · DRAFT</text><text y="52" class="s" font-size="17">COMPARE · SIMULATE</text></g><g transform="translate(870 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="box"/><text y="-12" class="n" font-size="23">REVIEW</text><text y="25" class="s" font-size="17">EVIDENCE</text><text y="52" class="s" font-size="17">UNCERTAINTY · DISSENT</text></g><g transform="translate(1110 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="human"/><text y="-12" class="n" font-size="23">AUTHORITY</text><text y="25" class="s" font-size="17">ACCEPT · REJECT</text><text y="52" class="s" font-size="17">NARROW · PAUSE</text></g><g transform="translate(1350 420)"><rect x="-105" y="-75" width="210" height="150" rx="24" class="box"/><text y="-12" class="n" font-size="23">RECEIPT</text><text y="25" class="s" font-size="17">ACTION · RESULT</text><text y="52" class="s" font-size="17">REPAIR · REPLAY</text></g></g><path d="M255 420H275" class="edge"/><path d="M495 420H515" class="edge"/><path d="M735 420H755" class="edge"/><path d="M975 420H995" class="edge"/><path d="M1215 420H1235" class="edge"/><path d="M1350 505C1310 700 350 700 150 505" class="return"/><text x="800" y="680" text-anchor="middle" class="t n" font-size="24">RECEIPTS RETURN TO THE HUMAN FOR REVIEW, CORRECTION, EXPORT, OR REPAIR</text><g class="t" text-anchor="middle"><rect x="190" y="760" width="340" height="80" rx="18" class="box"/><text x="360" y="807" class="n" font-size="20">CC MAY PROPOSE — NOT SELF-AUTHORIZE</text><rect x="630" y="760" width="340" height="80" rx="18" class="box"/><text x="800" y="807" class="n" font-size="20">DISAGREEMENT REMAINS VISIBLE</text><rect x="1070" y="760" width="340" height="80" rx="18" class="box"/><text x="1240" y="807" class="n" font-size="20">PAUSE AND EXIT REMAIN EASY</text></g></svg>