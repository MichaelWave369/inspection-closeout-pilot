<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Double C language boundary map</title><desc id="desc">Authority-laundering phrases are contrasted with bounded collaboration language that names proposals, evidence, uncertainty, human authorization, and receipts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070409"/><stop offset="1" stop-color="#221127"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff3fb}.s{font-weight:600;fill:#d5b9ce}.n{font-weight:900;fill:#ffe8f7}.bad{fill:#31151f;stroke:#ff929d;stroke-width:3}.good{fill:#103238;stroke:#7de4df;stroke-width:3}.label{font-weight:900;fill:#f3c9e3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="62">LANGUAGE THAT PRESERVES AUTHORITY</text><text x="82" y="140" class="t s" font-size="23">Public wording should reveal what the system did, what remains uncertain, and who actually authorized the outcome.</text><g class="t"><text x="170" y="220" class="label" font-size="24">AUTHORITY-LAUNDERING PHRASE</text><text x="850" y="220" class="label" font-size="24">BOUNDED COLLABORATION LANGUAGE</text><g transform="translate(90 255)"><rect width="610" height="105" rx="22" class="bad"/><text x="30" y="47" class="n" font-size="25">“The AI decided.”</text><text x="30" y="78" class="s" font-size="17">Hides proposal, mandate, and authorization.</text></g><g transform="translate(800 255)"><rect width="710" height="105" rx="22" class="good"/><text x="30" y="43" class="n" font-size="23">“The CC proposed; the authorized human decided.”</text><text x="30" y="76" class="s" font-size="17">Names the system role and the authority source.</text></g><g transform="translate(90 385)"><rect width="610" height="105" rx="22" class="bad"/><text x="30" y="47" class="n" font-size="25">“The AI knows you.”</text><text x="30" y="78" class="s" font-size="17">Converts an inference into emotional certainty.</text></g><g transform="translate(800 385)"><rect width="710" height="105" rx="22" class="good"/><text x="30" y="38" class="n" font-size="21">“The CC inferred this from available context.”</text><text x="30" y="69" class="s" font-size="17">Uncertainty and retained-context limits remain visible.</text></g><g transform="translate(90 515)"><rect width="610" height="105" rx="22" class="bad"/><text x="30" y="47" class="n" font-size="25">“Trust the AI.”</text><text x="30" y="78" class="s" font-size="17">Replaces inspection with status or branding.</text></g><g transform="translate(800 515)"><rect width="710" height="105" rx="22" class="good"/><text x="30" y="38" class="n" font-size="21">“Inspect evidence, authority, uncertainty, and receipts.”</text><text x="30" y="69" class="s" font-size="17">Trust remains conditional and revisable.</text></g><g transform="translate(90 645)"><rect width="610" height="105" rx="22" class="bad"/><text x="30" y="47" class="n" font-size="25">“The AI autonomously fixed it.”</text><text x="30" y="78" class="s" font-size="17">Hides scope, execution boundary, and repair record.</text></g><g transform="translate(800 645)"><rect width="710" height="105" rx="22" class="good"/><text x="30" y="34" class="n" font-size="20">“The CC executed an authorized bounded workflow.”</text><text x="30" y="65" class="s" font-size="17">The receipt shows what changed and what did not.</text></g></g><text x="800" y="840" text-anchor="middle" class="t s" font-size="20">BETTER LANGUAGE DOES NOT MAKE A BAD SYSTEM SAFE. IMPLEMENTATION RECEIPTS STILL DECIDE.</text></svg>