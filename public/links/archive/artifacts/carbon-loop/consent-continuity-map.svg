<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Consent and continuity map</title><desc id="desc">Three nested boundaries place the person and their authority at the center, surrounded by temporary reflection, optional continuity, and external human support. Clinical and crisis care remain outside the product boundary.</desc><defs><radialGradient id="bg"><stop stop-color="#281725"/><stop offset="1" stop-color="#08060a"/></radialGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff6fa}.s{font-weight:600;fill:#d8c0cb}.n{font-weight:900;fill:#fff1f7}.m{font-weight:700;fill:#cfaebd}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="88" y="100" class="t h" font-size="62">CONSENT &amp; CONTINUITY BOUNDARIES</text><text x="90" y="145" class="t s" font-size="23">Nothing crosses a boundary by default. Continuity is optional, inspectable, revocable, and human-controlled.</text><g transform="translate(800 500)"><circle r="315" fill="#0e0a10" stroke="#7faee8" stroke-width="4"/><circle r="235" fill="#17101a" stroke="#ff9dc6" stroke-width="4"/><circle r="145" fill="#241621" stroke="#ffc49f" stroke-width="4"/><circle r="70" fill="#ffb3d0"/><text y="8" text-anchor="middle" class="t" font-size="25" font-weight="900" fill="#2b1421">PERSON</text><text y="-100" text-anchor="middle" class="t n" font-size="22">EXPLICIT CHOICE</text><text y="-188" text-anchor="middle" class="t n" font-size="22">TEMPORARY REFLECTION</text><text y="-272" text-anchor="middle" class="t n" font-size="22">OPTIONAL CONTINUITY</text><text x="-250" y="10" text-anchor="middle" class="t m" font-size="18">INSPECT</text><text x="250" y="10" text-anchor="middle" class="t m" font-size="18">REVOKE</text><text x="0" y="286" text-anchor="middle" class="t m" font-size="18">SHARE WITH A REAL PERSON ONLY WHEN CHOSEN</text></g><g class="t"><rect x="80" y="230" width="330" height="120" rx="22" fill="#17101a" stroke="#ff9dc6"/><text x="245" y="272" text-anchor="middle" class="n" font-size="22">DEFAULT</text><text x="245" y="307" text-anchor="middle" class="m" font-size="17">No account · no saved session</text><text x="245" y="332" text-anchor="middle" class="m" font-size="17">no hidden inference</text><rect x="1190" y="230" width="330" height="120" rx="22" fill="#17101a" stroke="#8fc9ff"/><text x="1355" y="272" text-anchor="middle" class="n" font-size="22">CONTINUITY</text><text x="1355" y="307" text-anchor="middle" class="m" font-size="17">User-selected · visible · deletable</text><text x="1355" y="332" text-anchor="middle" class="m" font-size="17">never silently extended</text><rect x="80" y="650" width="390" height="125" rx="22" fill="#17101a" stroke="#8ee0b2"/><text x="275" y="692" text-anchor="middle" class="n" font-size="22">HUMAN HANDOFF</text><text x="275" y="727" text-anchor="middle" class="m" font-size="17">Trusted person · practical help</text><text x="275" y="752" text-anchor="middle" class="m" font-size="17">professional support when chosen</text><rect x="1130" y="650" width="390" height="125" rx="22" fill="#21151a" stroke="#f5ce83"/><text x="1325" y="692" text-anchor="middle" class="n" font-size="22">OUTSIDE PRODUCT BOUNDARY</text><text x="1325" y="727" text-anchor="middle" class="m" font-size="17">Diagnosis · treatment · crisis response</text><text x="1325" y="752" text-anchor="middle" class="m" font-size="17">emergency or clinical decision-making</text></g><text x="800" y="860" text-anchor="middle" class="t s" font-size="18">THE SYSTEM MAY HELP PREPARE A HANDOFF. IT MAY NOT PRETEND TO BE THE PERSON OR SERVICE RECEIVING IT.</text></svg>