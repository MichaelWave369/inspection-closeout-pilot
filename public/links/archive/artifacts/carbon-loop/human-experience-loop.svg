<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Carbon Loop human experience flow</title><desc id="desc">A six-stage loop: arrive, name, notice what matters, choose one next action, reconnect with a real person when useful, and continue only with consent.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09060d"/><stop offset="1" stop-color="#281522"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ffacd0"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff6fa}.s{font-weight:600;fill:#d8bfcb}.n{font-weight:900;fill:#fff0f6}.m{font-weight:700;fill:#cfaebe}.box{fill:#17101a;stroke:#ff9dc6;stroke-width:3}.edge{fill:none;stroke:#ffacd0;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="88" y="100" class="t h" font-size="62">THE HUMAN EXPERIENCE LOOP</text><text x="90" y="145" class="t s" font-size="23">A bounded reflection rhythm that ends in human-owned choice, not endless engagement.</text><g class="t" text-anchor="middle"><g transform="translate(235 320)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">1 · ARRIVE</text><text y="25" class="m" font-size="17">What is happening now?</text></g><g transform="translate(610 220)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">2 · NAME</text><text y="25" class="m" font-size="17">Use your own words.</text></g><g transform="translate(990 220)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">3 · MATTER</text><text y="25" class="m" font-size="17">What deserves attention?</text></g><g transform="translate(1365 320)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">4 · CHOOSE</text><text y="25" class="m" font-size="17">One humane next action.</text></g><g transform="translate(1110 650)"><rect x="-170" y="-95" width="340" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">5 · RECONNECT</text><text y="25" class="m" font-size="17">Bring in a real person when useful.</text></g><g transform="translate(490 650)"><rect x="-170" y="-95" width="340" height="190" rx="28" class="box"/><text y="-22" class="n" font-size="30">6 · CONTINUE</text><text y="25" class="m" font-size="17">Save nothing unless explicitly chosen.</text></g></g><path d="M385 290C455 245 500 235 450 235" class="edge"/><path d="M760 220H830" class="edge"/><path d="M1140 240C1210 250 1235 270 1215 290" class="edge"/><path d="M1325 415C1280 500 1235 555 1210 568" class="edge"/><path d="M940 650H670" class="edge"/><path d="M385 605C265 550 215 500 220 430" class="edge"/><g class="t"><rect x="505" y="390" width="590" height="125" rx="32" fill="#100b13" stroke="#8fc9ff" stroke-width="3"/><text x="800" y="435" text-anchor="middle" class="n" font-size="27">HUMAN AUTHORITY REMAINS CENTRAL</text><text x="800" y="474" text-anchor="middle" class="m" font-size="18">CONSENT · PAUSE · EXIT · DELETE · SHARE · OVERRIDE</text><text x="800" y="815" text-anchor="middle" class="s" font-size="18">SUCCESS IS NOT MORE SCREEN TIME. SUCCESS IS A CLEARER, SAFER, MORE HUMAN NEXT STEP.</text></g></svg>