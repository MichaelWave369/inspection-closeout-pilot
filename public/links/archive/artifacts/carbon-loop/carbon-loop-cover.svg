<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Carbon Loop cover</title><desc id="desc">Nested human-centered loops move from arrival through reflection, choice, action, reconnection, and continuity while consent and human authority remain at the center.</desc><defs><radialGradient id="bg"><stop stop-color="#3a1b31"/><stop offset="1" stop-color="#09060c"/></radialGradient><linearGradient id="ring"><stop stop-color="#ff9dc6"/><stop offset="1" stop-color="#8fc9ff"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff5fa}.s{font-weight:600;fill:#d8bfca}.n{font-weight:900;fill:#fff0f7}.m{font-weight:700;fill:#d5b7c6}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="90" y="105" class="t h" font-size="72">CARBON LOOP</text><text x="92" y="152" class="t s" font-size="24">Human Experience OS lineage · LumenBridge public experience · consent-based reflection and next action</text><g transform="translate(800 505)"><circle r="330" fill="none" stroke="#ff9dc6" stroke-width="2" opacity=".28"/><circle r="270" fill="none" stroke="#8fc9ff" stroke-width="3" stroke-dasharray="16 14" opacity=".45"/><circle r="205" fill="none" stroke="url(#ring)" stroke-width="18" opacity=".8"/><circle r="120" fill="#170e19" stroke="#ffc49f" stroke-width="4"/><text y="-20" text-anchor="middle" class="t n" font-size="32">HUMAN</text><text y="18" text-anchor="middle" class="t n" font-size="32">AUTHORITY</text><text y="55" text-anchor="middle" class="t m" font-size="17">CONSENT · EXIT · OVERRIDE</text><g class="t n" font-size="22" text-anchor="middle"><text x="0" y="-232">ARRIVE</text><text x="205" y="-115">REFLECT</text><text x="210" y="125">CHOOSE</text><text x="0" y="250">ACT</text><text x="-210" y="125">RECONNECT</text><text x="-205" y="-115">CONTINUE</text></g><g fill="#ffb4d1"><circle cx="0" cy="-205" r="16"/><circle cx="178" cy="-102" r="16"/><circle cx="178" cy="102" r="16"/><circle cx="0" cy="205" r="16"/><circle cx="-178" cy="102" r="16"/><circle cx="-178" cy="-102" r="16"/></g></g><g class="t"><rect x="95" y="850" width="440" height="82" rx="20" fill="#160d18" stroke="#ff9dc6"/><text x="315" y="885" text-anchor="middle" class="n" font-size="20">LOCAL-FIRST REFLECTION</text><text x="315" y="914" text-anchor="middle" class="m" font-size="16">NO ACCOUNT · NO TRACKING</text><rect x="580" y="850" width="440" height="82" rx="20" fill="#160d18" stroke="#8fc9ff"/><text x="800" y="885" text-anchor="middle" class="n" font-size="20">HUMAN CONNECTION STAYS REAL</text><text x="800" y="914" text-anchor="middle" class="m" font-size="16">SUPPORTS HANDOFF · NEVER REPLACES IT</text><rect x="1065" y="850" width="440" height="82" rx="20" fill="#160d18" stroke="#ffc49f"/><text x="1285" y="885" text-anchor="middle" class="n" font-size="20">NOT CLINICAL CARE</text><text x="1285" y="914" text-anchor="middle" class="m" font-size="16">NO DIAGNOSIS · NO CRISIS SERVICE</text></g><text x="800" y="975" text-anchor="middle" class="t m" font-size="17">A REFLECTION LAYER FOR MEANINGFUL NEXT ACTION — NOT A SUBSTITUTE FOR PEOPLE</text></svg>