<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SignalBridge Outcome Migration Map</title><desc id="desc">Software tools are grouped into workflow clusters, evaluated for readiness and custody, then routed to not yet, shadow trial, human-gated proof run, or bounded Proof Run candidate states.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020507"/><stop offset="1" stop-color="#102f3a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#63deda"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2ffff}.s{font-weight:600;fill:#aecbd0}.n{font-weight:900;fill:#eaffff}.m{font-weight:700;fill:#9db9bf}.box{fill:#071821;stroke:#43aaa8;stroke-width:3}.good{fill:#172d25;stroke:#82dda5;stroke-width:4}.hold{fill:#302817;stroke:#f1ca78;stroke-width:4}.stop{fill:#351921;stroke:#ff9199;stroke-width:4}.edge{fill:none;stroke:#63deda;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">OUTCOME MIGRATION MAP</text><text x="78" y="140" class="t s" font-size="23">The map recommends a next evidence state; it does not authorize live migration.</text><g class="t" text-anchor="middle"><g transform="translate(175 405)"><rect x="-115" y="-70" width="230" height="140" rx="24" class="box"/><text y="-20" class="n" font-size="25">APP INVENTORY</text><text y="20" class="s" font-size="18">SPEND · SEATS · OWNER</text><text y="49" class="s" font-size="18">USAGE NOTES</text></g><g transform="translate(475 405)"><rect x="-125" y="-76" width="250" height="152" rx="24" class="box"/><text y="-27" class="n" font-size="25">WORKFLOW CLUSTER</text><text y="13" class="s" font-size="18">OUTCOME · OVERLAP</text><text y="42" class="s" font-size="18">DEPENDENCIES · RISK</text></g><g transform="translate(790 405)"><rect x="-135" y="-90" width="270" height="180" rx="26" class="box"/><text y="-48" class="n" font-size="25">READINESS REVIEW</text><text y="-10" class="s" font-size="17">PROCESS · PROVENANCE</text><text y="19" class="s" font-size="17">AUTHORITY · REVERSIBILITY</text><text y="48" class="s" font-size="17">EVIDENCE · EXCEPTIONS</text><text y="77" class="m" font-size="15">PLANNING HEURISTIC ONLY</text></g></g><path class="edge" d="M290 405H350"/><path class="edge" d="M600 405H655"/><g class="t" text-anchor="middle"><g transform="translate(1180 190)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="stop"/><text y="-10" class="n" font-size="25">NOT YET</text><text y="27" class="s" font-size="17">MISSING CUSTODY OR CONTROL</text></g><g transform="translate(1180 335)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="hold"/><text y="-10" class="n" font-size="25">SHADOW TRIAL ONLY</text><text y="27" class="s" font-size="17">OBSERVE WITHOUT LIVE EFFECT</text></g><g transform="translate(1180 480)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="hold"/><text y="-10" class="n" font-size="25">HUMAN-GATED RUN</text><text y="27" class="s" font-size="17">APPROVAL AT EACH BOUNDARY</text></g><g transform="translate(1180 625)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="good"/><text y="-10" class="n" font-size="25">PROOF RUN CANDIDATE</text><text y="27" class="s" font-size="17">BOUNDED · REVERSIBLE · RECEIPTED</text></g></g><path class="edge" d="M925 350L1035 205"/><path class="edge" d="M925 385L1035 340"/><path class="edge" d="M925 425L1035 475"/><path class="edge" d="M925 460L1035 620"/><text x="80" y="805" class="t n" font-size="27">THE ECONOMIC DELTA IS A HYPOTHESIS UNTIL SOURCE DATA AND A PROOF RUN SUPPORT IT.</text><text x="80" y="850" class="t m" font-size="18">NO SOFTWARE CANCELLATION, DATA MOVEMENT, PURCHASING, UNDERWRITING, OR PRODUCTION ACTION OCCURS IN THE MAP.</text></svg>