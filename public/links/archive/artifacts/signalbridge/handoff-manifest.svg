<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SignalBridge Parallax Handoff Manifest</title><desc id="desc">A SignalBridge candidate is handed to Parallax with intent, actor, authority, boundaries, allowed and prohibited actions, evidence requirements, exception paths, rollback, and an unsigned or signed receipt state.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020507"/><stop offset="1" stop-color="#102f3a"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2ffff}.s{font-weight:600;fill:#aecbd0}.n{font-weight:900;fill:#eaffff}.m{font-weight:700;fill:#9db9bf}.box{fill:#071821;stroke:#43aaa8;stroke-width:3}.gate{fill:#172d25;stroke:#82dda5;stroke-width:4}.hold{fill:#302817;stroke:#f1ca78;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">PARALLAX HANDOFF MANIFEST</text><text x="78" y="140" class="t s" font-size="23">The bridge transfers the decision context required to evaluate a bounded execution-contract candidate.</text><g class="t"><g transform="translate(90 205)"><rect width="670" height="525" rx="28" class="box"/><text x="35" y="58" class="n" font-size="28">SIGNALBRIDGE OUTPUT</text><text x="35" y="112" class="s" font-size="21">01 · Workflow cluster and intended outcome</text><text x="35" y="158" class="s" font-size="21">02 · Receipt requirements</text><text x="35" y="204" class="s" font-size="21">03 · Risk, custody, and dependency notes</text><text x="35" y="250" class="s" font-size="21">04 · Bounded economic-delta hypothesis</text><text x="35" y="296" class="s" font-size="21">05 · Simulation recommendation</text><text x="35" y="342" class="s" font-size="21">06 · Proof Run candidate state</text><text x="35" y="406" class="m" font-size="17">THE OUTPUT MAY SAY NOT YET.</text><text x="35" y="450" class="m" font-size="17">NO LIVE EXECUTION AUTHORITY IS IMPLIED.</text></g><g transform="translate(840 205)"><rect width="670" height="525" rx="28" class="gate"/><text x="35" y="58" class="n" font-size="28">PARALLAX EXECUTION-CONTRACT CANDIDATE</text><text x="35" y="112" class="s" font-size="21">INTENT · ACTOR · AUTHORITY</text><text x="35" y="158" class="s" font-size="21">BOUNDARY DECLARATION</text><text x="35" y="204" class="s" font-size="21">ALLOWED AND PROHIBITED ACTIONS</text><text x="35" y="250" class="s" font-size="21">LINEAGE FIELD + EVIDENCE SCHEMA</text><text x="35" y="296" class="s" font-size="21">APPROVAL AND EXCEPTION GATES</text><text x="35" y="342" class="s" font-size="21">ROLLBACK / COMPENSATION PATH</text><text x="35" y="388" class="s" font-size="21">SIGNATURE + RECEIPT STATE</text><rect x="35" y="430" width="600" height="60" rx="16" class="hold"/><text x="335" y="469" text-anchor="middle" class="n" font-size="20">HUMAN AUTHORIZATION REQUIRED BEFORE ANY LIVE ACTION</text></g></g><text x="800" y="805" text-anchor="middle" class="t n" font-size="27">A HANDOFF PRESERVES WHY, WHO, HOW FAR, WHAT EVIDENCE, AND HOW TO STOP.</text><text x="800" y="850" text-anchor="middle" class="t m" font-size="18">AN UNSIGNED DEMONSTRATION MANIFEST IS NOT A CONTRACT, APPROVAL, RECEIPT, OR PRODUCTION COMMAND.</text></svg>