<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">SignalBridge Archive cover</title><desc id="desc">A software inventory becomes workflow clusters, an Outcome Migration Map, a bounded mock Proof Run, and a Parallax Handoff Manifest requiring human approval.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020507"/><stop offset="1" stop-color="#0d3340"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#63deda"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2ffff}.s{font-weight:600;fill:#aecbd0}.n{font-weight:900;fill:#eaffff}.m{font-weight:700;fill:#9db9bf}.box{fill:#071821;stroke:#43aaa8;stroke-width:3}.gate{fill:#172d25;stroke:#82dda5;stroke-width:4}.human{fill:#322918;stroke:#f1ca78;stroke-width:4}.edge{fill:none;stroke:#63deda;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="105" class="t h" font-size="72">SIGNALBRIDGE</text><text x="83" y="152" class="t s" font-size="24">OUTCOME MIGRATION MAP · MOCK PROOF RUN · GOVERNED HANDOFF</text><g class="t" text-anchor="middle"><g transform="translate(160 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">INVENTORY</text><text y="25" class="s" font-size="18">APPS · SPEND · SEATS</text><text y="52" class="s" font-size="18">OWNERS · USAGE</text></g><g transform="translate(405 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">CLUSTER</text><text y="25" class="s" font-size="18">WORKFLOWS · OVERLAP</text><text y="52" class="s" font-size="18">DEPENDENCIES</text></g><g transform="translate(650 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="gate"/><text y="-15" class="n" font-size="24">MAP</text><text y="25" class="s" font-size="18">READINESS · CUSTODY</text><text y="52" class="s" font-size="18">ECONOMIC DELTA</text></g><g transform="translate(895 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="box"/><text y="-15" class="n" font-size="24">MOCK RUN</text><text y="25" class="s" font-size="18">SHADOW ONLY</text><text y="52" class="s" font-size="18">NO LIVE ACTION</text></g><g transform="translate(1140 470)"><rect x="-105" y="-72" width="210" height="144" rx="24" class="gate"/><text y="-15" class="n" font-size="24">HANDOFF</text><text y="25" class="s" font-size="18">INTENT · AUTHORITY</text><text y="52" class="s" font-size="18">EVIDENCE · ROLLBACK</text></g><g transform="translate(1400 470)"><rect x="-115" y="-72" width="230" height="144" rx="24" class="human"/><text y="-15" class="n" font-size="24">HUMAN DECISION</text><text y="25" class="s" font-size="18">ADMIT · REPAIR</text><text y="52" class="s" font-size="18">OR SAY NOT YET</text></g></g><path class="edge" d="M265 470H285"/><path class="edge" d="M510 470H530"/><path class="edge" d="M755 470H775"/><path class="edge" d="M1000 470H1020"/><path class="edge" d="M1245 470H1270"/><g class="t"><text x="80" y="760" class="n" font-size="31">THE BRIDGE CARRIES CONTEXT, NOT JUST A RECOMMENDATION.</text><text x="80" y="810" class="s" font-size="22">Workflow cluster · receipt requirements · risk and custody notes · bounded economic delta · simulation recommendation</text><text x="80" y="865" class="n" font-size="28">A PROOF RUN CANDIDATE IS NOT PRODUCTION AUTHORIZATION.</text><text x="80" y="920" class="m" font-size="18">NO TRACTION, REVENUE, VERIFIED SAVINGS, AUTOMATED UNDERWRITING, OR LIVE EXECUTION IS CLAIMED.</text></g></svg>