<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Parallax Canon Census and Continuity Atlas cover</title><desc id="desc">A protected source archive flows into a local workspace, review queue, continuity atlas, and approved export zone. Founder authority remains above canon decisions and the source archive is never mutated.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070402"/><stop offset="1" stop-color="#2a1909"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#efae5b"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#fff7ec}.s{font-weight:600;fill:#d6c2a8}.n{font-weight:900;fill:#fff0d8}.m{font-weight:700;fill:#bfa98d}.box{fill:#160e06;stroke:#9a6530;stroke-width:3}.safe{fill:#0e2424;stroke:#78d9d4;stroke-width:4}.review{fill:#2a1909;stroke:#efae5b;stroke-width:4}.auth{fill:#36231a;stroke:#f2cf7a;stroke-width:5}.edge{fill:none;stroke:#efae5b;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="78" y="98" class="t h" font-size="65">PARALLAX CANON CENSUS</text><text x="80" y="145" class="t s" font-size="24">CONTINUITY ATLAS · READ-ONLY DISCOVERY · FOUNDER-APPROVED CANON</text><g class="t" text-anchor="middle"><g transform="translate(220 505)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="safe"/><text y="-32" class="n" font-size="28">SOURCE ARCHIVE</text><text y="9" class="s" font-size="19">ORIGINALS STAY PUT</text><text y="41" class="s" font-size="19">HASH · LOCATION · DATES</text><text y="73" class="s" font-size="17">NO RENAME · MOVE · DELETE</text></g><g transform="translate(600 505)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-32" class="n" font-size="28">LOCAL WORKSPACE</text><text y="9" class="s" font-size="19">REGISTRY · THUMBNAILS</text><text y="41" class="s" font-size="19">SANDBOX EXTRACTION</text><text y="73" class="s" font-size="17">DISPOSABLE DERIVATIVES</text></g><g transform="translate(980 505)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="review"/><text y="-32" class="n" font-size="28">REVIEW QUEUE</text><text y="9" class="s" font-size="19">DUPLICATES · VERSIONS</text><text y="41" class="s" font-size="19">LINEAGE · CONTRADICTIONS</text><text y="73" class="s" font-size="17">PROPOSALS, NOT CANON</text></g><g transform="translate(1380 505)"><rect x="-150" y="-95" width="300" height="190" rx="28" class="box"/><text y="-32" class="n" font-size="28">EXPORT ZONE</text><text y="9" class="s" font-size="19">APPROVED DERIVATIVES</text><text y="41" class="s" font-size="19">PROVENANCE · BOUNDARY</text><text y="73" class="s" font-size="17">RELEASE ENVELOPE REQUIRED</text></g><g transform="translate(980 220)"><rect x="-220" y="-70" width="440" height="140" rx="30" class="auth"/><text y="-12" class="n" font-size="31">MICHAEL W. HUGHES</text><text y="30" class="s" font-size="20">FINAL CANON AUTHORITY</text><text y="58" class="s" font-size="17">CCs MAY ADVISE · NEVER REPLACE JUDGMENT</text></g><g transform="translate(980 805)"><rect x="-220" y="-70" width="440" height="140" rx="28" class="safe"/><text y="-12" class="n" font-size="29">CONTINUITY ATLAS</text><text y="30" class="s" font-size="19">ORIGIN · PRESENT · FUTURE</text><text y="58" class="s" font-size="17">PREDECESSORS · SUCCESSORS · STATUS</text></g></g><path d="M370 505H430" class="edge"/><path d="M750 505H810" class="edge"/><path d="M1130 505H1210" class="edge"/><path d="M980 290V382" class="edge"/><path d="M980 600V727" class="edge"/><text x="800" y="950" text-anchor="middle" class="t m" font-size="19">DISCOVER WITHOUT MUTATION · PROPOSE WITHOUT CANONIZING · EXPORT ONLY WITH APPROVAL</text></svg>