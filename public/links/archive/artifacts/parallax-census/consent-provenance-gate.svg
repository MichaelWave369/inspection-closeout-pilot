<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parallax Census consent and provenance gate</title><desc id="desc">A candidate must pass source, custody, duplicate, permission, privacy, claim-boundary, and human-approval checks before it can become a public canonical record.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03070b"/><stop offset="1" stop-color="#123148"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effbff}.s{font-weight:600;fill:#b5ced9}.n{font-weight:900;fill:#e4f8ff}.m{font-weight:700;fill:#9db7c4}.ring{fill:none;stroke:#71ccff;stroke-width:5}.gate{fill:#0a1822;stroke:#4aaee0;stroke-width:3}.human{fill:#173326;stroke:#83d9a5;stroke-width:4}.stop{fill:#351a22;stroke:#ff9098;stroke-width:4}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="78" y="92" class="t h" font-size="60">CONSENT + PROVENANCE GATE</text><text x="80" y="137" class="t s" font-size="23">Discovery produces a candidate. These checks determine whether it may move closer to public canon.</text><g transform="translate(790 485)"><circle r="260" class="ring" opacity=".25"/><circle r="175" class="ring" opacity=".5"/><rect x="-145" y="-90" width="290" height="180" rx="34" class="human"/><text y="-30" text-anchor="middle" class="t n" font-size="30">HUMAN APPROVAL</text><text y="12" text-anchor="middle" class="t s" font-size="19">AUTHORITY · SCOPE</text><text y="45" text-anchor="middle" class="t s" font-size="19">PUBLICATION DECISION</text><text y="76" text-anchor="middle" class="t s" font-size="19">RECEIPT + REPAIR</text></g><g class="t" text-anchor="middle"><g transform="translate(790 195)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">SOURCE IDENTITY</text></g><g transform="translate(1110 270)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">CUSTODY</text></g><g transform="translate(1240 510)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">DUPLICATE CHECK</text></g><g transform="translate(1100 735)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">CLAIM BOUNDARY</text></g><g transform="translate(480 735)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">PUBLIC PERMISSION</text></g><g transform="translate(340 510)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">PRIVACY SCOPE</text></g><g transform="translate(470 270)"><rect x="-120" y="-43" width="240" height="86" rx="20" class="gate"/><text y="8" class="n" font-size="22">STATUS FRESHNESS</text></g></g><g transform="translate(1420 700)"><rect x="-125" y="-72" width="250" height="144" rx="25" class="stop"/><text y="-15" text-anchor="middle" class="t n" font-size="24">QUARANTINE</text><text y="24" text-anchor="middle" class="t s" font-size="17">MISSING · PRIVATE</text><text y="51" text-anchor="middle" class="t s" font-size="17">CONFLICTED · STALE</text></g><text x="80" y="840" class="t m" font-size="18">PASSING THE GATE MAKES A RECORD ELIGIBLE FOR REVIEW. IT DOES NOT AUTOMATICALLY PUBLISH OR PROVE THE CLAIM.</text></svg>