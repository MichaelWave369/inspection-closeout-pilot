<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parallax Census registry lifecycle</title><desc id="desc">A candidate record may be admitted, quarantined, linked as an alias or relationship, superseded with a receipt, or withdrawn from public presentation while history remains explicit.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04070b"/><stop offset="1" stop-color="#102b3b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#72ceff"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#effbff}.s{font-weight:600;fill:#b5ced9}.n{font-weight:900;fill:#e3f8ff}.m{font-weight:700;fill:#9cb7c4}.box{fill:#0a1822;stroke:#4aaee0;stroke-width:3}.good{fill:#153225;stroke:#83d9a5;stroke-width:4}.hold{fill:#332918;stroke:#efc879;stroke-width:4}.stop{fill:#371922;stroke:#ff9098;stroke-width:4}.edge{fill:none;stroke:#72ceff;stroke-width:4;marker-end:url(#a)}.dash{stroke-dasharray:12 9}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">PARALLAX CENSUS · REGISTRY LIFECYCLE</text><text x="78" y="140" class="t s" font-size="23">Canonical records change through explicit states and receipts—not silent replacement.</text><g class="t" text-anchor="middle"><g transform="translate(190 390)"><rect x="-120" y="-65" width="240" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="25">DISCOVERED</text><text y="30" class="s" font-size="18">UNVERIFIED CANDIDATE</text></g><g transform="translate(500 240)"><rect x="-120" y="-65" width="240" height="130" rx="24" class="hold"/><text y="-8" class="n" font-size="25">QUARANTINED</text><text y="30" class="s" font-size="18">MISSING OR CONFLICTED</text></g><g transform="translate(500 540)"><rect x="-120" y="-65" width="240" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="25">LINKED</text><text y="30" class="s" font-size="18">ALIAS · RELATIONSHIP</text></g><g transform="translate(820 390)"><rect x="-130" y="-72" width="260" height="144" rx="26" class="good"/><text y="-15" class="n" font-size="26">CANONICAL</text><text y="25" class="s" font-size="18">APPROVED RECORD</text><text y="52" class="s" font-size="18">VERSION + RECEIPT</text></g><g transform="translate(1130 240)"><rect x="-120" y="-65" width="240" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="25">SUPERSEDED</text><text y="30" class="s" font-size="18">NEW VERSION ATTACHED</text></g><g transform="translate(1130 540)"><rect x="-120" y="-65" width="240" height="130" rx="24" class="stop"/><text y="-8" class="n" font-size="25">WITHDRAWN</text><text y="30" class="s" font-size="18">PUBLIC EXPOSURE ENDS</text></g><g transform="translate(1430 390)"><rect x="-110" y="-65" width="220" height="130" rx="24" class="box"/><text y="-8" class="n" font-size="25">REPAIRED</text><text y="30" class="s" font-size="18">HISTORY PRESERVED</text></g></g><path class="edge" d="M310 365L380 285"/><path class="edge" d="M310 415L380 495"/><path class="edge" d="M620 270L690 345"/><path class="edge" d="M620 510L690 435"/><path class="edge" d="M950 345L1010 285"/><path class="edge" d="M950 435L1010 495"/><path class="edge" d="M1250 270L1320 345"/><path class="edge" d="M1250 510L1320 435"/><path class="edge dash" d="M1130 305V355H950"/><text x="800" y="755" text-anchor="middle" class="t n" font-size="26">OLD STATES ARE NOT ERASED TO MAKE THE NEW STORY LOOK CLEANER.</text><text x="800" y="803" text-anchor="middle" class="t s" font-size="20">Correction, supersession, withdrawal, and repair each require stated authority and a continuity receipt.</text><text x="800" y="850" text-anchor="middle" class="t m" font-size="17">A WITHDRAWN PUBLIC RECORD MAY RETAIN ONLY THE MINIMUM HISTORY REQUIRED BY ITS GOVERNANCE AND CONSENT RULES.</text></svg>