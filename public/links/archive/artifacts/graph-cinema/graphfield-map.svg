<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Graphfield and trajectory map</title><desc id="desc">Three graph frames sit inside a governed graphfield. Multiple possible trajectories connect the frames while policy, authority, dissent, and ledger constraints surround the field.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040713"/><stop offset="1" stop-color="#0d1730"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#68e0da"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2f7ff}.s{font-weight:600;fill:#a8bad6}.n{font-weight:900;fill:#ddf8ff}.m{font-weight:700;fill:#8fa6c7}.frame{fill:#0a1427;stroke:#6da6ff;stroke-width:3}.field{fill:none;stroke:#a985ff;stroke-width:3;stroke-dasharray:14 14}.path{fill:none;stroke:#68e0da;stroke-width:7;marker-end:url(#a)}.alt{fill:none;stroke:#a985ff;stroke-width:6;stroke-dasharray:14 10}.guard{fill:#111e37;stroke:#334f7d;stroke-width:2}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="88" y="100" class="t h" font-size="62">GRAPHFIELD → TRAJECTORY → LEDGER</text><text x="90" y="145" class="t s" font-size="23">Frames are visible states. Admissible motion is the governed object between them.</text><rect x="95" y="205" width="1410" height="520" rx="55" class="field"/><text x="130" y="255" class="t n" font-size="24">GOVERNED GRAPHFIELD</text><g transform="translate(170 325)"><rect width="330" height="265" rx="28" class="frame"/><text x="165" y="45" text-anchor="middle" class="t n" font-size="26">FRAME 0</text><circle cx="95" cy="120" r="24" fill="#183458"/><circle cx="235" cy="95" r="24" fill="#183458"/><circle cx="180" cy="205" r="24" fill="#183458"/><line x1="115" y1="110" x2="215" y2="100" stroke="#648fd1" stroke-width="4"/><line x1="110" y1="140" x2="165" y2="187" stroke="#648fd1" stroke-width="4"/></g><g transform="translate(635 325)"><rect width="330" height="265" rx="28" class="frame"/><text x="165" y="45" text-anchor="middle" class="t n" font-size="26">FRAME 1</text><circle cx="85" cy="130" r="24" fill="#183458"/><circle cx="240" cy="100" r="24" fill="#183458"/><circle cx="180" cy="205" r="24" fill="#39204b" stroke="#d79cff" stroke-width="4"/><line x1="107" y1="125" x2="217" y2="105" stroke="#648fd1" stroke-width="4"/><line x1="103" y1="145" x2="162" y2="190" stroke="#648fd1" stroke-width="4"/><line x1="220" y1="120" x2="194" y2="183" stroke="#648fd1" stroke-width="4"/></g><g transform="translate(1100 325)"><rect width="330" height="265" rx="28" class="frame"/><text x="165" y="45" text-anchor="middle" class="t n" font-size="26">FRAME 2</text><circle cx="90" cy="115" r="24" fill="#183458"/><circle cx="235" cy="110" r="24" fill="#1d4b46" stroke="#68e0da" stroke-width="4"/><circle cx="185" cy="205" r="24" fill="#183458"/><line x1="113" y1="115" x2="211" y2="110" stroke="#648fd1" stroke-width="4"/><line x1="222" y1="130" x2="198" y2="182" stroke="#648fd1" stroke-width="4"/></g><path d="M500 455C555 390 585 390 635 455" class="path"/><path d="M965 455C1025 375 1050 375 1100 455" class="path"/><path d="M500 500C555 610 585 610 635 500" class="alt"/><path d="M965 500C1025 630 1060 630 1100 500" class="alt"/><g class="t"><rect x="130" y="755" width="270" height="76" rx="18" class="guard"/><text x="265" y="800" text-anchor="middle" class="n" font-size="20">POLICY CAPSULE</text><rect x="450" y="755" width="270" height="76" rx="18" class="guard"/><text x="585" y="800" text-anchor="middle" class="n" font-size="20">AUTHORITY CHECK</text><rect x="770" y="755" width="270" height="76" rx="18" class="guard"/><text x="905" y="800" text-anchor="middle" class="n" font-size="20">PROTECTED DISSENT</text><rect x="1090" y="755" width="380" height="76" rx="18" class="guard"/><text x="1280" y="790" text-anchor="middle" class="n" font-size="20">CONTINUITY LEDGER</t