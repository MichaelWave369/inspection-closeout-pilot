<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Office judgment and canonical motion track</title><desc id="desc">Observer, Cartographer, Protected Dissenter, Governor, Operator, and Repairer produce separate judgments along the canonical path from decision packet through deterministic replay.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030711"/><stop offset="1" stop-color="#11152b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6ce5df"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f2f7ff}.s{font-weight:600;fill:#aabbd3}.n{font-weight:900;fill:#e5f5ff}.m{font-weight:700;fill:#9eafd0}.edge{stroke:#6ce5df;stroke-width:4;marker-end:url(#a)}.lane{stroke:#334769;stroke-width:2}.seal{fill:#0c1730;stroke:#709fff;stroke-width:2}.dissent{fill:#321a44;stroke:#dc9cff;stroke-width:3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="60">CANONICAL MOTION / OFFICE JUDGMENT TRACK</text><text x="82" y="138" class="t s" font-size="22">Separate offices produce sealed judgments. Graph Cinema replays the accepted object and preserved dissent.</text><g class="t" text-anchor="middle"><g transform="translate(115 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">1</text><text y="80" class="n" font-size="17">DECISION</text><text y="104" class="m" font-size="15">PACKET</text></g><g transform="translate(315 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">2</text><text y="80" class="n" font-size="17">SEALED</text><text y="104" class="m" font-size="15">JUDGMENTS</text></g><g transform="translate(515 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">3</text><text y="80" class="n" font-size="17">SYNTHESIS</text></g><g transform="translate(715 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">4</text><text y="80" class="n" font-size="17">AUTHORITY</text></g><g transform="translate(915 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">5</text><text y="80" class="n" font-size="17">REWRITE</text></g><g transform="translate(1115 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">6</text><text y="80" class="n" font-size="17">RECEIPT</text></g><g transform="translate(1315 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">7</text><text y="80" class="n" font-size="17">FRAME</text></g><g transform="translate(1490 220)"><circle r="32" fill="#6ce5df"/><text y="8" fill="#07101a" font-size="20" font-weight="900">8</text><text y="80" class="n" font-size="17">REPLAY</text></g></g><g class="edge"><line x1="150" y1="220" x2="278" y2="220"/><line x1="350" y1="220" x2="478" y2="220"/><line x1="550" y1="220" x2="678" y2="220"/><line x1="750" y1="220" x2="878" y2="220"/><line x1="950" y1="220" x2="1078" y2="220"/><line x1="1150" y1="220" x2="1278" y2="220"/><line x1="1350" y1="220" x2="1450" y2="220"/></g><g class="t"><text x="90" y="400" class="n" font-size="21">OBSERVER</text><text x="90" y="480" class="n" font-size="21">CARTOGRAPHER</text><text x="90" y="560" fill="#e4b6ff" font-size="21" font-weight="900">PROTECTED DISSENTER</text><text x="90" y="640" class="n" font-size="21">GOVERNOR</text><text x="90" y="720" class="n" font-size="21">OPERATOR</text><text x="90" y="800" class="n" font-size="21">REPAIRER</text></g><g><line x1="300" y1="393" x2="1490" y2="393" class="lane"/><line x1="300" y1="473" x2="1490" y2="473" class="lane"/><line x1="300" y1="553" x2="1490" y2="553" class="lane"/><line x1="300" y1="633" x2="1490" y2="633" class="lane"/><line x1="300" y1="713" x2="1490" y2="713" class="lane"/><line x1="300" y1="793" x2="1490" y2="793" class="lane"/></g><g class="t" text-anchor="middle"><rect x="345" y="365" width="150" height="55" rx="14" class="seal"/><text x="420" y="399" class="m" font-size="15">OBSERVATION</text><rect x="345" y="445" width="150" height="55" rx="14" class="seal"/><text x="420" y="479" class="m" font-size="15">DEPENDENCIES</text><rect x="345" y="525" width="150" height="55" rx="14" class="dissent"/><text x="420" y="559" fill="#efd9ff" font-size="15" font-weight="800">OBJECTION</text><rect x="670" y="605" width="150" height="55" rx="14" class="seal"/><text x="745" y="639" class="m" font-size="15">AUTHORIZATION</text><rect x="865" y="685" width="150" height="55" rx="14" class="seal"/><text x="940" y="719" class="m" font-size="15">BOUNDED ACTION</text><rect x="865" y="765" width="150" height="55" rx="14" class="seal"/><text x="940" y="799" class="m" font-size="15">REPAIR</text><rect x="1050" y="525" width="150" height="55" rx="14" class="dissent"/><text x="1125" y="559" fill="#efd9ff" font-size="15" font-weight="800">PRESERVED</text><rect x="1050" y="365" width="150" height="55" rx="14" class="seal"/><text x="1125" y="399" class="m" font-size="15">RECEIPT LINK</text></g></svg>