<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Graph Cinema cover</title><desc id="desc">Successive graph frames form a filmstrip while two trajectories move through a governed graphfield toward a continuity ledger.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030611"/><stop offset="1" stop-color="#101a36"/></linearGradient><linearGradient id="film" x2="1"><stop stop-color="#6de6df"/><stop offset="1" stop-color="#7ca8ff"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f1f7ff}.s{font-weight:600;fill:#adbed8}.n{font-weight:900;fill:#dffcff}.m{font-weight:700;fill:#9fb1cf}.edge{stroke:#6de6df;stroke-width:4;opacity:.65}.edge2{stroke:#aa88ff;stroke-width:4;opacity:.72}.node{fill:#0b1428;stroke:#7ca8ff;stroke-width:3}.hot{fill:#17374b;stroke:#6de6df;stroke-width:4}.dissent{fill:#321a43;stroke:#d89bff;stroke-width:4}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="86" y="105" class="t h" font-size="72">GRAPH CINEMA</text><text x="90" y="152" class="t s" font-size="24">The ledgered motion picture formed by successive graph frames and the decisions between them.</text><g transform="translate(100 235)"><rect width="1400" height="520" rx="36" fill="#071020" stroke="#274b75" stroke-width="3"/><g opacity=".6"><circle cx="190" cy="210" r="35" class="node"/><circle cx="410" cy="120" r="35" class="node"/><circle cx="610" cy="260" r="35" class="node"/><circle cx="850" cy="130" r="35" class="node"/><circle cx="1080" cy="260" r="35" class="node"/><circle cx="1260" cy="150" r="35" class="node"/><line x1="225" y1="198" x2="375" y2="133" class="edge"/><line x1="443" y1="139" x2="580" y2="240" class="edge"/><line x1="645" y1="244" x2="815" y2="146" class="edge"/><line x1="885" y1="150" x2="1045" y2="240" class="edge"/><line x1="1115" y1="242" x2="1225" y2="168" class="edge"/></g><path d="M190 210C360 40 470 360 610 260S840 40 850 130S1030 390 1080 260S1210 65 1260 150" fill="none" class="edge" stroke-width="9"/><path d="M190 210C330 330 470 70 610 260S790 390 850 130S1030 80 1080 260S1190 340 1260 150" fill="none" class="edge2" stroke-width="8"/><circle cx="610" cy="260" r="50" class="dissent"/><text x="610" y="269" text-anchor="middle" class="t n" font-size="18">DISSENT</text><circle cx="1260" cy="150" r="50" class="hot"/><text x="1260" y="158" text-anchor="middle" class="t n" font-size="18">FRAME</text><g transform="translate(120 360)"><rect width="1160" height="105" rx="18" fill="#09162c" stroke="url(#film)" stroke-width="3"/><g fill="#7ca8ff" opacity=".55"><rect x="22" y="18" width="42" height="20"/><rect x="86" y="18" width="42" height="20"/><rect x="150" y="18" width="42" height="20"/><rect x="214" y="18" width="42" height="20"/><rect x="278" y="18" width="42" height="20"/><rect x="342" y="18" width="42" height="20"/><rect x="406" y="18" width="42" height="20"/><rect x="470" y="18" width="42" height="20"/><rect x="534" y="18" width="42" height="20"/><rect x="598" y="18" width="42" height="20"/><rect x="662" y="18" width="42" height="20"/><rect x="726" y="18" width="42" height="20"/><rect x="790" y="18" width="42" height="20"/><rect x="854" y="18" width="42" height="20"/><rect x="918" y="18" width="42" height="20"/><rect x="982" y="18" width="42" height="20"/><rect x="1046" y="18" width="42" height="20"/></g><text x="580" y="76" text-anchor="middle" class="t n" font-size="28">DECISION → JUDGMENT → AUTHORITY → REWRITE → RECEIPT → REPLAY</text></g></g><g transform="translate(90 825)"><text class="t n" font-size="28">A GRAPH IS A FRAME.</text><text x="350" class="t n" font-size="28">A GRAPHFIELD PRODUCES THE FRAMES.</text><text x="1045" class="t n" font-size="28">THE LEDGER PRESERVES WHY.</text><text y="55" class="t m" font-size="18">RUNTIME VISUALIZATION · NOT THE SOURCE OF TRUTH</text></g></svg>