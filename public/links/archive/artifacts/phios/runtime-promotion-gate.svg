<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PhiOS runtime promotion gate</title><desc id="desc">A primary PhiKernel adapter and a shadow adapter produce locally stored normalized comparison records. Advisory readiness states never auto-promote; a human operator reviews evidence and may hold, promote deliberately, reverse-shadow validate, or roll back.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020604"/><stop offset="1" stop-color="#103126"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#72d9ee"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f0fff8}.s{font-weight:600;fill:#b6d1c6}.n{font-weight:900;fill:#eafff5}.m{font-weight:700;fill:#9fbdb0}.box{fill:#081b15;stroke:#48b98b;stroke-width:3}.core{fill:#162f3a;stroke:#72d9ee;stroke-width:4}.human{fill:#342918;stroke:#f0c777;stroke-width:4}.stop{fill:#351922;stroke:#ff9199;stroke-width:4}.edge{fill:none;stroke:#72d9ee;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">KERNEL ADAPTER PROMOTION GATE</text><text x="78" y="140" class="t s" font-size="23">Shadow comparison informs an operator. It never switches the runtime by itself.</text><g class="t" text-anchor="middle"><g transform="translate(190 330)"><rect x="-125" y="-75" width="250" height="150" rx="24" class="core"/><text y="-25" class="n" font-size="25">PRIMARY ADAPTER</text><text y="16" class="s" font-size="18">NORMAL RUNTIME RESULT</text><text y="49" class="s" font-size="18">CURRENT BEHAVIOR</text></g><g transform="translate(190 590)"><rect x="-125" y="-75" width="250" height="150" rx="24" class="box"/><text y="-25" class="n" font-size="25">SHADOW ADAPTER</text><text y="16" class="s" font-size="18">COMPARE ONLY</text><text y="49" class="s" font-size="18">NO PRIMARY EFFECT</text></g><g transform="translate(560 460)"><rect x="-145" y="-95" width="290" height="190" rx="28" class="box"/><text y="-49" class="n" font-size="25">NORMALIZED DELTAS</text><text y="-8" class="s" font-size="18">LOCAL COMPARE RECORD</text><text y="23" class="s" font-size="18">CHANGE RATE · SCORE DELTA</text><text y="54" class="s" font-size="18">DEDUPE · REPORT</text><text y="83" class="m" font-size="15">NO PROPRIETARY INTERNALS</text></g><g transform="translate(900 460)"><rect x="-140" y="-90" width="280" height="180" rx="27" class="human"/><text y="-45" class="n" font-size="25">ADVISORY REVIEW</text><text y="-4" class="s" font-size="18">READY · CAUTION · HOLD</text><text y="27" class="s" font-size="18">TRANSPARENT HEURISTICS</text><text y="58" class="s" font-size="18">MANUAL OPERATOR JUDGMENT</text></g><g transform="translate(1260 300)"><rect x="-140" y="-68" width="280" height="136" rx="23" class="core"/><text y="-14" class="n" font-size="24">DELIBERATE PROMOTION</text><text y="28" class="s" font-size="18">EXPLICIT OPERATOR ACTION</text></g><g transform="translate(1260 460)"><rect x="-140" y="-68" width="280" height="136" rx="23" class="box"/><text y="-14" class="n" font-size="24">REVERSE-SHADOW</text><text y="28" class="s" font-size="18">VALIDATE AFTER CHANGE</text></g><g transform="translate(1260 620)"><rect x="-140" y="-68" width="280" height="136" rx="23" class="stop"/><text y="-14" class="n" font-size="24">HOLD / ROLLBACK</text><text y="28" class="s" font-size="18">PRESERVE PRIOR PATH</text></g></g><path class="edge" d="M315 330L415 410"/><path class="edge" d="M315 590L415 510"/><path class="edge" d="M705 460H760"/><path class="edge" d="M1040 410L1120 320"/><path class="edge" d="M1040 460H1120"/><path class="edge" d="M1040 510L1120 600"/><text x="80" y="805" class="t n" font-size="27">READY IS AN ADVISORY STATE—NOT PROOF OF CORRECTNESS, SAFETY, OR PERMISSION TO SWITCH.</text><text x="80" y="850" class="t m" font-size="18">COMPARE MODE USES THE PRIMARY RESULT FOR NORMAL FLOWS; SHADOW OUTPUTS SUPPORT REVIEW ONLY.</text></svg>