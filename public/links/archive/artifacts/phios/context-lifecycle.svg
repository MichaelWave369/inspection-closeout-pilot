<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PhiOS context lifecycle</title><desc id="desc">Declared identity and persona settings combine with sourced memory candidates, conflict review, scope and expiry rules, a human-approved context packet, mission use, and optional corrected writeback.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020604"/><stop offset="1" stop-color="#103126"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#68e2b0"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f0fff8}.s{font-weight:600;fill:#b6d1c6}.n{font-weight:900;fill:#eafff5}.m{font-weight:700;fill:#9fbdb0}.box{fill:#081b15;stroke:#48b98b;stroke-width:3}.good{fill:#173326;stroke:#68e2b0;stroke-width:4}.hold{fill:#342918;stroke:#f0c777;stroke-width:4}.stop{fill:#351922;stroke:#ff9199;stroke-width:4}.edge{fill:none;stroke:#68e2b0;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="95" class="t h" font-size="62">CONTEXT SOVEREIGNTY LIFECYCLE</text><text x="78" y="140" class="t s" font-size="23">Context enters a mission only through source, scope, conflict, consent, and expiry review.</text><g class="t" text-anchor="middle"><g transform="translate(165 390)"><rect x="-110" y="-72" width="220" height="144" rx="24" class="box"/><text y="-16" class="n" font-size="24">DECLARE</text><text y="24" class="s" font-size="18">IDENTITY LABELS</text><text y="52" class="s" font-size="18">PERSONA SETTINGS</text></g><g transform="translate(430 390)"><rect x="-110" y="-72" width="220" height="144" rx="24" class="box"/><text y="-16" class="n" font-size="24">RETRIEVE</text><text y="24" class="s" font-size="18">MEMORY CANDIDATES</text><text y="52" class="s" font-size="18">SOURCE · DATE · SCOPE</text></g><g transform="translate(705 390)"><rect x="-120" y="-80" width="240" height="160" rx="26" class="hold"/><text y="-30" class="n" font-size="24">REVIEW</text><text y="10" class="s" font-size="18">CONFLICTS · PRIVACY</text><text y="40" class="s" font-size="18">RELEVANCE · EXPIRY</text><text y="69" class="s" font-size="18">AUTHORITY · CONSENT</text></g><g transform="translate(990 390)"><rect x="-120" y="-80" width="240" height="160" rx="26" class="good"/><text y="-30" class="n" font-size="24">CONTEXT PACK</text><text y="10" class="s" font-size="18">BOUNDED · SOURCED</text><text y="40" class="s" font-size="18">UNCERTAINTY VISIBLE</text><text y="69" class="s" font-size="18">HUMAN APPROVED</text></g><g transform="translate(1270 390)"><rect x="-115" y="-72" width="230" height="144" rx="24" class="box"/><text y="-16" class="n" font-size="24">MISSION USE</text><text y="24" class="s" font-size="18">READ-ONLY CONTEXT</text><text y="52" class="s" font-size="18">TRACE · OUTCOME</text></g><g transform="translate(1490 390)"><rect x="-85" y="-72" width="170" height="144" rx="24" class="good"/><text y="-16" class="n" font-size="23">WRITEBACK</text><text y="24" class="s" font-size="17">REVIEW</text><text y="52" class="s" font-size="17">CORRECT / DECLINE</text></g></g><path class="edge" d="M275 390H320"/><path class="edge" d="M540 390H585"/><path class="edge" d="M825 390H870"/><path class="edge" d="M1110 390H1155"/><path class="edge" d="M1385 390H1405"/><g class="t" text-anchor="middle"><g transform="translate(705 650)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="stop"/><text y="-10" class="n" font-size="24">QUARANTINE</text><text y="27" class="s" font-size="17">PRIVATE · STALE · CONFLICTED</text></g><g transform="translate(1080 650)"><rect x="-145" y="-60" width="290" height="120" rx="22" class="hold"/><text y="-10" class="n" font-size="24">REPAIR REQUEST</text><text y="27" class="s" font-size="17">SOURCE · SCOPE · CONSENT</text></g></g><path class="edge" d="M705 470V590"/><path class="edge" d="M850 650H935"/><text x="80" y="805" class="t n" font-size="27">A MEMORY RECORD MAY BE ACCURATELY STORED AND STILL BE IRRELEVANT, OUTDATED, MISUNDERSTOOD, OR FALSE.</text><text x="80" y="850" class="t m" font-size="18">WRITEBACK CREATES A PROPOSED CONTINUITY EVENT. IT DOES NOT SILENTLY REDEFINE THE USER, PERSONA, OR CANONICAL MEMORY.</text></svg>