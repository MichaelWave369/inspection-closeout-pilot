<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">PhiOS Archive cover</title><desc id="desc">PhiOS acts as a sovereign operator shell above PhiKernel. Human-declared identity and persona settings, sourced memory context, capability policy, runtime comparison, and reviewable writeback remain bounded by operator authority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020604"/><stop offset="1" stop-color="#12382b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#68e2b0"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f0fff8}.s{font-weight:600;fill:#b6d1c6}.n{font-weight:900;fill:#eafff5}.m{font-weight:700;fill:#9fbdb0}.box{fill:#081b15;stroke:#48b98b;stroke-width:3}.core{fill:#162f3a;stroke:#72d9ee;stroke-width:4}.human{fill:#342918;stroke:#f0c777;stroke-width:4}.gate{fill:#173326;stroke:#68e2b0;stroke-width:4}.edge{fill:none;stroke:#68e2b0;stroke-width:5;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="105" class="t h" font-size="76">φ PhiOS</text><text x="83" y="152" class="t s" font-size="24">SOVEREIGN OPERATOR SHELL · LOCAL CONTEXT · MANUAL AUTHORITY · REVIEWABLE CONTINUITY</text><g class="t" text-anchor="middle"><g transform="translate(155 470)"><rect x="-110" y="-82" width="220" height="164" rx="26" class="human"/><text y="-34" class="n" font-size="24">HUMAN OPERATOR</text><text y="7" class="s" font-size="18">DECLARE · REVIEW</text><text y="38" class="s" font-size="18">CORRECT · DECLINE</text><text y="68" class="s" font-size="18">PROMOTE · ROLLBACK</text></g><g transform="translate(430 470)"><rect x="-125" y="-90" width="250" height="180" rx="28" class="box"/><text y="-46" class="n" font-size="24">CONTEXT PACK</text><text y="-6" class="s" font-size="18">IDENTITY LABELS</text><text y="24" class="s" font-size="18">PERSONA SETTINGS</text><text y="54" class="s" font-size="18">SOURCED MEMORY</text><text y="82" class="s" font-size="18">SCOPE · EXPIRY</text></g><g transform="translate(725 470)"><rect x="-125" y="-90" width="250" height="180" rx="28" class="gate"/><text y="-46" class="n" font-size="24">SOVEREIGN GATE</text><text y="-6" class="s" font-size="18">CAPABILITY PROFILE</text><text y="24" class="s" font-size="18">CONSENT · AUTHORITY</text><text y="54" class="s" font-size="18">PRIVATE / PUBLIC SCOPE</text><text y="82" class="s" font-size="18">WRITEBACK POLICY</text></g><g transform="translate(1015 470)"><rect x="-125" y="-90" width="250" height="180" rx="28" class="box"/><text y="-46" class="n" font-size="24">PhiOS SHELL</text><text y="-6" class="s" font-size="18">CLI · MCP · OBSERVATORY</text><text y="24" class="s" font-size="18">SESSION · ARCHIVE</text><text y="54" class="s" font-size="18">COMPARE · REPORT</text><text y="82" class="s" font-size="18">OPERATOR EXPERIENCE</text></g><g transform="translate(1290 470)"><rect x="-115" y="-82" width="230" height="164" rx="26" class="core"/><text y="-34" class="n" font-size="24">PhiKernel</text><text y="7" class="s" font-size="18">RUNTIME CORE</text><text y="38" class="s" font-size="18">ANCHOR · CAPSULES</text><text y="68" class="s" font-size="18">ROUTING SAFETY</text></g><g transform="translate(1490 470)"><rect x="-85" y="-82" width="170" height="164" rx="26" class="box"/><text y="-34" class="n" font-size="23">RECEIPT</text><text y="7" class="s" font-size="17">SOURCE</text><text y="38" class="s" font-size="17">DECISION</text><text y="68" class="s" font-size="17">REPAIR</text></g></g><path class="edge" d="M265 470H305"/><path class="edge" d="M555 470H600"/><path class="edge" d="M850 470H890"/><path class="edge" d="M1140 470H1175"/><path class="edge" d="M1405 470H1410"/><g class="t"><text x="80" y="748" class="n" font-size="31">IDENTITY IS DECLARED CONTEXT—NOT PROOF OF PERSONHOOD.</text><text x="80" y="800" class="s" font-size="22">Persona is configuration · memory is sourced context · comparison is advisory · writeback is reviewable</text><text x="80" y="860" class="n" font-size="28">PhiKernel IS AUTHORITATIVE INSIDE THE SOFTWARE RUNTIME—NOT ABOUT A HUMAN BEING OR PHYSICAL REALITY.</text><text x="80" y="920" class="m" font-size="18">PUBLIC DEMO: FIXED SYNTHETIC DATA ONLY · NO MEMORY ACCESS · NO MCP · NO PULSE · NO DISPATCH · NO ADAPTER PROMOTION</text></g></svg>