<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parallax Regenerative Sector Covenant</title><desc id="desc">Every active sector must return more verified human, ecological, knowledge, resilience, or livelihood value than it consumes, without hiding harm.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050805"/><stop offset="1" stop-color="#173321"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f4fff6}.s{font-weight:600;fill:#b8cfbc}.n{font-weight:900;fill:#e4ffe9}.m{font-weight:700;fill:#94ad9a}.ring{fill:none;stroke:#8fdca0;stroke-width:5}.box{fill:#0c1810;stroke:#5db271;stroke-width:3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="60">PARALLAX REGENERATIVE SECTOR COVENANT</text><text x="82" y="140" class="t s" font-size="23">No isolated departments. No hidden externalities. Every sector teaches, heals, restores, and returns value.</text><g transform="translate(800 455)"><circle r="280" class="ring" opacity=".35"/><circle r="185" class="ring" opacity=".6"/><circle r="95" fill="#193f27" stroke="#b1f0bc" stroke-width="5"/><text y="-15" text-anchor="middle" class="t n" font-size="28">RETURN MORE</text><text y="22" text-anchor="middle" class="t n" font-size="28">THAN IT</text><text y="59" text-anchor="middle" class="t n" font-size="28">CONSUMES</text></g><g class="t" text-anchor="middle"><g transform="translate(800 190)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">HUMAN VALUE</text></g><g transform="translate(1080 310)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">ECOLOGICAL</text></g><g transform="translate(1120 610)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">KNOWLEDGE</text></g><g transform="translate(800 730)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">RESILIENCE</text></g><g transform="translate(480 610)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">LIVELIHOOD</text></g><g transform="translate(520 310)"><rect x="-125" y="-42" width="250" height="84" rx="20" class="box"/><text y="8" class="n" font-size="23">VISIBLE COSTS</text></g></g><text x="800" y="840" text-anchor="middle" class="t n" font-size="23">VALUE MUST BE STATED, MEASURED WHERE POSSIBLE, AND REVISED WHEN EVIDENCE DISAGREES.</text><text x="800" y="875" text-anchor="middle" class="t m" font-size="16">A COVENANT IS A GOVERNING COMMITMENT—NOT PROOF THAT EVERY CURRENT PROJECT HAS ALREADY MET IT.</text></svg>