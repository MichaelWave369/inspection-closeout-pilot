<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Parallax Institute Archive cover</title><desc id="desc">A central Parallax Institute stewardship core connects four institutional functions: stewardship, research, prototyping, and public benefit, surrounded by evidence, consent, repair, and human authority.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030603"/><stop offset="1" stop-color="#17311d"/></linearGradient><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f3fff5}.s{font-weight:600;fill:#b4cdb9}.n{font-weight:900;fill:#e1ffe7}.m{font-weight:700;fill:#97b59e}.edge{stroke:#91dca1;stroke-width:5;opacity:.65}.box{fill:#0d1a10;stroke:#5fb676;stroke-width:3}.core{fill:#173b22;stroke:#b2f0bd;stroke-width:5}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="82" y="105" class="t h" font-size="72">PARALLAX INSTITUTE</text><text x="86" y="152" class="t s" font-size="24">Stewardship for research, prototypes, public evidence, and regenerative benefit.</text><g transform="translate(800 500)"><circle r="325" fill="none" stroke="#5fb676" stroke-width="2" opacity=".32"/><rect x="-205" y="-110" width="410" height="220" rx="38" class="core"/><text y="-42" text-anchor="middle" class="t n" font-size="36">INSTITUTE CORE</text><text y="6" text-anchor="middle" class="t s" font-size="21">VISION · STEWARDSHIP</text><text y="43" text-anchor="middle" class="t s" font-size="21">BOUNDARIES · CONTINUITY</text><text y="80" text-anchor="middle" class="t s" font-size="21">PUBLIC-BENEFIT COVENANT</text></g><g class="t" text-anchor="middle"><g transform="translate(800 210)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">STEWARDSHIP</text></g><g transform="translate(1190 500)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">RESEARCH</text></g><g transform="translate(800 790)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">PROTOTYPING</text></g><g transform="translate(410 500)"><rect x="-130" y="-48" width="260" height="96" rx="22" class="box"/><text y="8" class="n" font-size="25">PUBLIC BENEFIT</text></g></g><g class="edge"><line x1="800" y1="258" x2="800" y2="390"/><line x1="1060" y1="500" x2="1005" y2="500"/><line x1="800" y1="742" x2="800" y2="610"/><line x1="540" y1="500" x2="595" y2="500"/></g><text x="800" y="920" text-anchor="middle" class="t n" font-size="25">EVIDENCE · CONSENT · REPAIR · HUMAN AUTHORITY</text><text x="800" y="963" text-anchor="middle" class="t m" font-size="17">PUBLIC INSTITUTIONAL IDENTITY · FUTURE PHYSICAL CAMPUS REMAINS PLANNED</text></svg>