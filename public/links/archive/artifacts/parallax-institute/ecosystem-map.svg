<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parallax Institute ecosystem map</title><desc id="desc">EnterTheField.org serves as the public doorway into the Archive, Institute, Labs, public-benefit systems, and creative worlds. The Institute is shown as stewardship and teaching, not as a legal ownership chart.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040704"/><stop offset="1" stop-color="#10261a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#8edca0"/></marker><style>.t{font-family:Arial,sans-serif}.h{font-weight:900;fill:#f4fff6}.s{font-weight:600;fill:#b3cbb8}.n{font-weight:900;fill:#e2ffe8}.m{font-weight:700;fill:#91aa97}.box{fill:#0b1710;stroke:#4ca467;stroke-width:3}.hot{fill:#173a23;stroke:#a5edb2;stroke-width:5}.edge{stroke:#8edca0;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="95" class="t h" font-size="62">PARALLAX PUBLIC ECOSYSTEM</text><text x="82" y="140" class="t s" font-size="23">A curatorial map of public roles and pathways—not a legal ownership chart or incorporated org structure.</text><g class="t" text-anchor="middle"><g transform="translate(800 245)"><rect x="-240" y="-65" width="480" height="130" rx="28" class="hot"/><text y="-8" class="n" font-size="34">ENTERTHEFIELD.ORG</text><text y="32" class="s" font-size="19">PUBLIC DOORWAY / COMMONS</text></g><g transform="translate(280 515)"><rect x="-170" y="-75" width="340" height="150" rx="25" class="box"/><text y="-15" class="n" font-size="28">PARALLAX ARCHIVE</text><text y="25" class="s" font-size="18">PROJECTS · ARTIFACTS</text><text y="52" class="s" font-size="18">RECEIPTS · LINEAGE</text></g><g transform="translate(650 515)"><rect x="-170" y="-75" width="340" height="150" rx="25" class="hot"/><text y="-15" class="n" font-size="28">PARALLAX INSTITUTE</text><text y="25" class="s" font-size="18">STEWARDSHIP · TEACHING</text><text y="52" class="s" font-size="18">BOUNDARIES · COVENANT</text></g><g transform="translate(1020 515)"><rect x="-170" y="-75" width="340" height="150" rx="25" class="box"/><text y="-15" class="n" font-size="28">PHI369 LABS</text><text y="25" class="s" font-size="18">RESEARCH · EXPERIMENTS</text><text y="52" class="s" font-size="18">PROTOTYPES · TESTS</text></g><g transform="translate(1390 515)"><rect x="-170" y="-75" width="340" height="150" rx="25" class="box"/><text y="-15" class="n" font-size="28">WORLDS &amp; CULTURE</text><text y="25" class="s" font-size="18">MUSIC · GAMES · STORIES</text><text y="52" class="s" font-size="18">PUBLIC EXPERIENCE</text></g><g transform="translate(800 770)"><rect x="-300" y="-55" width="600" height="110" rx="24" class="box"/><text y="-7" class="n" font-size="27">PUBLIC-BENEFIT SYSTEMS</text><text y="30" class="s" font-size="18">HUMAN · ECOLOGICAL · KNOWLEDGE · RESILIENCE · LIVELIHOOD VALUE</text></g></g><g class="edge"><path d="M690 310L360 440"/><path d="M760 310L680 440"/><path d="M840 310L990 440"/><path d="M910 310L1320 440"/><path d="M650 590L750 715"/><path d="M1020 590L850 715"/></g><text x="800" y="865" text-anchor="middle" class="t m" font-size="17">FUTURE PHYSICAL INSTITUTE: PLANNED MT. SHASTA / PILGRIM CREEK VISION · NOT A PRESENT FACILITY</text></svg>