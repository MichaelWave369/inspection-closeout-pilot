name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Archive Core data
        shell: bash
        run: |
          set -o pipefail
          npm run check:archive-data 2>&1 | tee archive-validation.log

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-validation-diagnostics
          path: archive-validation.log
          if-no-files-found: ignore

      - name: Check LumenBridge boundaries
        run: npm run check:lumenbridge

      - name: Check ALO receipt fixtures
        run: npm run check:alo

      - name: Check Parallax Institute boundaries
        run: npm run check:institute

      - name: Check Coherence Bridge boundaries
        run: npm run check:coherence

      - name: Check RoomLight field-safety boundaries
        run: npm run check:roomlight

      - name: Check Double C language boundaries
        run: npm run check:double-c

      - name: Check SOSA governance boundaries
        run: npm run check:sosa

      - name: Check Parallax Census boundaries
        run: npm run check:census

      - name: Check SignalBridge boundaries
        run: npm run check:signalbridge

      - name: Check Vibe compiler boundaries
        run: npm run check:vibe

      - name: Check Agentora operator boundaries
        run: npm run check:agentora

      - name: Check public JavaScript
        run: npm run check:public-js

      - name: Build site
        run: npm run build:site

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
